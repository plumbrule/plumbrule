open_questions:
  - PgBouncer、Patroni、Qdrant、Milvus、SeaweedFS、Garage、gh-ost、Percona XtraBackup 的许可证未从官方仓库 LICENSE 逐一核实（报告给出 PgBouncer 为 ISC、Patroni 为 MIT、Qdrant 与 Milvus 为 Apache-2.0、SeaweedFS 为 Apache-2.0、Garage 为 AGPLv3、gh-ost 为 MIT）
  - pgBackRest 2026 年归档又恢复维护的经过只有二手报道（官网未见公告），赞助模式的长期稳定性待观察
  - 报告称某个 PostgreSQL 小版本发布说明要求重做全量备份、重建部分索引，未核实原文
  - MySQL 的新版本命名体系（LTS 与 Innovation 发布线）及 Percona XtraBackup 对新 MySQL 主版本的支持情况未核实
  - CloudNativePG 内置备份改走 Barman Cloud 插件的现状未核实
  - 达梦、金仓当前稳定版本与兼容范围未核实
  - 待补调研：现成的 PostgreSQL 队列库（与 18 共同确认归属和默认推荐）
  - 待补调研：恢复演练频率的业界依据（目前只是参考值），以及备份编排工具（与 26 衔接）
  - 待补调研：对象存储上传的病毒扫描工具选型（与 25 衔接）
  - 待补调研：MySQL 侧的隔离级别默认值（可重复读）对 DB-021、DB-022 的影响及间隙锁行为
