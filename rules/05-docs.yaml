open_questions:
  - llms.txt：官网标为提案第 2 版（最后修改 2026-08-10），已核实；主流模型厂商是否实际读取它，只有第三方说法，未核实
  - VitePress 1.x 稳定线是否还会发安全修复、2.0 何时转正，官方没有明确说法，待跟进
  - Docusaurus 4 的进展、Starlight 维护方变化（第三方称 Astro 团队已被 Cloudflare 收购）只有第三方来源，未从官方核实
  - Mermaid 的 sandbox 模式是否已脱离测试阶段，待核实当前文档
  - ADR 格式（MADR 与 Nygard 格式）的现状和许可未联网核实；待补调研：ADR 工具（如 adr-tools、log4brains）是否值得推荐
  - AutoCorrect、zhlint、textlint、draw.io 的许可证未从官方仓库 LICENSE 逐一核实
  - 待补调研：公开的中文技术写作指南（如中文文案排版指北、中文技术文档写作风格指南）之间冲突时怎么取舍，以及一份完整的中文标点与空格例外表
  - 待补调研：文档过期检测的现成工具（基于 frontmatter 的检查器、文档站插件），目前只有自写脚本的做法
  - 待补调研：中文界面文案的公开规范（归 09，本主题只引用）
  - 待补调研：文档站和文档工具在国产操作系统、国产 CPU、国产浏览器上的实测情况
