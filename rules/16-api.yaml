open_questions:
  - Spectral、Redocly CLI、oasdiff、Scalar、Redoc、OpenAPI Generator、AsyncAPI CLI 的许可证本次未联网核实，以各仓库 LICENSE 为准
  - MCP 2026-07-28 版工具规范中 isError、structuredContent、outputSchema 可为任意 JSON 类型、工具注解不可信等细节本次未逐条联网复核
  - 原报告称 HTTP QUERY 方法已于 2026-06 成为 RFC 10008，未核实；核实前不把 QUERY 写进规则
  - 新接口 JSON 字段默认 camelCase 是本主题的裁决（依据 Microsoft 指南和前端生态），Zalando 等指南用 snake_case；需与 02 再确认口径
  - 待补调研：模拟服务器（mock server）和消费者驱动契约测试工具的选型（与 04 协调）
  - 待补调研：webhook 发送端的现成库或服务（含可私有化部署的方案）
  - 待补调研：Connect、GraphQL 各语言实现与许可证；字段选择与过滤参数的业界约定
