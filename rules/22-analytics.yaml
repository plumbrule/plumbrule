open_questions:
  - 未联网核实（沿用报告 2026-11-13 的说法）：Plausible 为 AGPL-3.0 且统计脚本为 MIT、Superset 为 Apache-2.0、Grafana 为 AGPL-3.0、Matomo 为 GPL-3.0、GrowthBook 为 MIT 加企业分层、Flagsmith 核心为 BSD-3-Clause、Doris 与 StarRocks 为 Apache-2.0
  - 未核实：Polars、pandas、nbstripout 的许可证
  - DuckDB、ClickHouse 的许可证只通过第三方页面印证，入库前应直接看官方仓库的 LICENSE
  - Soda Core 改为 Elastic License 2.0 的具体时间和版本各方说法不一，需看官方发布说明
  - Metabase 开源版嵌入产品时的义务（带标识的免费嵌入与付费嵌入许可）需要按 27 的口径由法务确认
  - PostHog 自托管下 ee 目录功能的具体授权方式未完全确认
  - 待补调研：埋点 SDK 选型（客户端与服务端，含移动端）
  - 待补调研：数据接入（ETL/ELT、CDC）工具，如 Airbyte、dlt、Debezium 的选型与许可
  - 待补调研：语义层工具（如 Cube、MetricFlow）是否值得推荐
  - 待补调研：国产 BI 和国产 OLAP 的选型与信创适配
  - 待补调研：同意管理平台（CMP）的选型与同意状态的标准格式
  - 待补调研：A/B 实验统计方法的外部依据（功效分析、CUPED、序贯检验、SRM 阈值），现有规则主要基于业界通行做法，缺少引用
  - 待补调研：图表类型选择与可读性规则的权威出处
  - 待补调研：产品分析事件与 OpenTelemetry 采集的边界，需与 26 对齐
