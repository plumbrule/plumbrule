open_questions:
  - GitHub workflow 依赖锁文件的状态：官方文档写的是公开预览，有第三方报道称 2026-10-28 已正式发布；是否覆盖所有套餐、是否锁住间接依赖，说法不一致
  - GitHub Actions schedule 的 timezone 字段：已由官方更新日志确认，但更新日志的准确日期（03-19 或 03-26）和夏令时处理细节未从官方文档核实
  - 目标 sh（dash、BusyBox ash）对 `set -o pipefail` 的支持情况，未逐个核实
  - Tombi 能否完全替代 Taplo（配置迁移、编辑器支持、长期维护人数），需要跟踪；Biome 是否已改用 Tombi 处理 TOML 只见于第三方 PR 描述
  - Biome 是否已支持 YAML 格式化（影响 CFG-022 的分工），未核实
  - Docker 相关文档、PSScriptAnalyzer 文档沿用原调研的查阅结果，本轮未重新核实
  - 待补调研：工具链版本统一锁定的做法（mise、aqua 等）在脚本与配置工具上的用法，需与 10 的选型对齐
  - 待补调研：hadolint、yamllint、zizmor、SQLFluff 的推荐最小配置文件，以及每条硬约束对应的具体规则编号
  - 待补调研：Windows 下运行 just、Task 时用哪个 shell；GitLab CI 复用（extends、!reference、components）的写法
  - 待补调研：zsh 脚本是否需要单独的检查工具
