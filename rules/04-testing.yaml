open_questions:
  - Playwright（Apache-2.0）、Cypress（核心 MIT）、Locust（MIT）、Chromatic CLI 的许可证本次未联网核实
  - Testcontainers 非 Java 版本（Go、Node、Python 等）的许可证未逐个核实
  - 覆盖率口径可补引 Google Testing Blog《Code Coverage Best Practices》（2020-08-07），正文未能抓取核实，暂不引用
  - 非 GitHub 平台（GitLab、Gitea、Jenkins）对「合并前验证最终合并结果」的等价机制未核实
  - 待补调研：移动端和桌面端 E2E 工具（归 28–31）
  - 待补调研：覆盖率统计与改动部分覆盖率的跨语言工具
  - 待补调研：接口破坏性差异检测工具、gRPC/protobuf 契约检查（与 16 协调）
  - 待补调研：不稳定测试检测与统计的现成工具（Allure、ReportPortal 等）及业界实证数据
  - 待补调研：测试金字塔与奖杯近两年的讨论，现有方法论来源均为 2018–2019 年
  - 待补调研：国产操作系统、CPU、数据库的兼容测试矩阵做法
