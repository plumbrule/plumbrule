open_questions:
  - 各工具的当前版本未写入规则，需另建版本账本从官方源拉取；原报告的版本号（截至 2026-11-13）均未逐个核实。
  - Prometheus 3 相对 2.x 的主要变化（如默认行为、UTF-8 指标名、原生直方图）未核实，升级指引待补。
  - Docker Compose 当前形态（插件方式、Compose 规范）与单机生产的官方表述未核实；原报告「Mattermost 只把 Compose 用于评估测试」的说法无法核实且引用错号，已删去。
  - Chainguard 免费层范围说法不一（官方定价页写 5 个镜像，第三方写约 50 个），以官方页面为准，采用前再确认。
  - distroless、Jaeger、Harbor、Fluent Bit、Vector 的许可证未从仓库 LICENSE 核实；Mimir 的许可证只见于第三方说法（AGPL-3.0），未直接核实。
  - OpenTelemetry Profiles 曾有「2026 年第三季度 GA」的说法，核实时状态页仍无任何语言稳定，按 alpha 处理；下次复核再看。
  - GlitchTip 新大版本「要求 PostgreSQL 15 及以上、环境变量有破坏性变化」只有一篇发布说明，未核实。
  - 本地运维遥测与产品分析埋点是否共用 OTel 管道、边界怎么划，需与 22 对齐。
  - 待补调研：压测工具（如 k6、Locust）的选型。
  - 待补调研：Kubernetes 备份编排（如 Velero）与系统级备份工具。
  - 待补调研：值班与事故管理工具（自托管和国内可用的方案）。
  - 待补调研：日志采集器（OpenTelemetry Collector、Fluent Bit、Vector 等）对比。
  - 待补调研：内网镜像仓库（如 Harbor）和离线镜像同步工具；国内公共镜像源现状。
  - 待补调研：私有化预检和诊断包的现成工具（如 Replicated troubleshoot、sosreport），避免自研。
  - 待补调研：容器运行时（containerd、Docker、Podman）在私有化和信创环境下的选择。
  - SLO 定义、恢复计划、开关清单没有通用标准格式，是否给出最小字段约定待定。
