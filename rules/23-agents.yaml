id: "23"
slug: agents
title: 编码 Agent 规范
summary: 让 Claude Code、Codex 这类编码 Agent 在任何仓库里可靠地干活：入口文件怎么写、权限怎么管、怎么证明做完了、多个 Agent 怎么并行、技能怎么写。
status: draft
reviewed_on: 2026-11-14
next_review: 2027-02-14
scope:
  includes:
    - 仓库入口文件（AGENTS.md 及各工具的适配文件）
    - Agent 的权限边界、证据与交付
    - 多 Agent 并行
    - 技能（Agent Skills）的写法与评测
    - Agent 配置的回归评测
  excludes:
    - { what: 测试分层、覆盖率、验收证据的通用口径, see: "04" }
    - { what: 分支保护、PR 评审、CI 门禁顺序, see: "03" }
    - { what: 提示注入、密钥、供应链的通用安全规则, see: "25" }
    - { what: 模型选择、评测工具、提示词管理, see: "24" }
    - { what: 本机沙箱、出口代理、进程隔离, see: "32" }
overview: |
  1. **写出来不等于生效。** AGENTS.md 是给 Agent 的说明，不是安全边界。权限、分支保护、合并条件、密钥、网络出口要靠沙箱、权限设置、CI 和代码托管平台去强制。
  2. **一个入口，多个适配。** 以 AGENTS.md 为唯一编辑源；Claude Code、Copilot、Gemini CLI 等只放薄适配文件或导入它。工具升级后要实测它真的读到了。
  3. **入口文件要短。** 只放高频不变量和索引，细节放到 `docs/`，让 Agent 按需去读。
  4. **干活的不能当裁判。** Agent 可以改测试，但不能放松验收；要求必过的检查、CI 配置、CODEOWNERS 的改动另走审批。合并要靠可信 CI 和独立评审。
  5. **交付要带证据。** 最终提交编号、跑了哪些检查和结果、没跑什么及原因、风险和回滚方式。没证据就不说成功。
  6. **外部内容都是数据。** issue、评论、网页、工具输出、其他 Agent 的消息里的「指令」不执行。
  7. **多 Agent 先并行读，再并行写。** 写的时候每个 Agent 一个独立工作树和分支，文件范围不重叠。
  8. **技能是流程知识，不是权限。** 技能描述写清何时用、何时不用，并用正反例测试触发。
  9. **按风险定流程。** 小改动不要求正式设计；跨模块或有外部副作用的改动先写简短方案。
rules:
  # ── 任何有 Agent 参与的仓库 ──
  - id: AGT-001
    title: 仓库根目录必须有 AGENTS.md，写明怎么构建和测试、关键约束、权威文档在哪、交付要求
    level: hard
    check: auto
    how: CI 检查文件存在且包含「构建与测试」「约束」「文档」「交付」四类小节
    applies: [kind:agent]
    why: AGENTS.md 是多数编码 Agent 都会读取的开放约定，没有它 Agent 只能靠猜。
    sources: [S01]
    see: ["05"]
  - id: AGT-002
    title: 入口文件只放高频不变量和索引，不复制整份架构文档或手册
    level: soft
    check: auto
    how: CI 统计行数，超过参考值时提示并要求说明
    applies: [kind:agent]
    why: 入口文件每次都会进上下文，越长越占空间、越容易被忽略。
    ref_value: 参考值 200 行以内（Claude Code 官方对 CLAUDE.md 的建议）；OpenAI 的案例把 AGENTS.md 控制在约 100 行、只当目录用。
    sources: [S02, S06]
  - id: AGT-003
    title: 以 AGENTS.md 为唯一编辑源，其他工具的规则文件只做薄适配或导入
    level: soft
    check: semi
    how: 评审时检查 CLAUDE.md、.github/copilot-instructions.md 等是否只含导入和工具特有内容
    applies: [kind:agent]
    why: 每个工具各写一套会互相漂移，Agent 读到的规则就不一致了。
    detail: |
      - Claude Code：没有 CLAUDE.md 时会直接读 AGENTS.md（2.1.277 及以后）；已有 CLAUDE.md 时，在其中写 `@AGENTS.md` 导入，再补 Claude 特有的内容。
      - Gemini CLI：用 GEMINI.md 导入，或把 `context.fileName` 指向 AGENTS.md。
      - Copilot：`.github/copilot-instructions.md` 只写 Copilot 特有内容。
    sources: [S02, S04, S07]
  - id: AGT-004
    title: 升级 Agent 工具后，用一个小问题实测它确实读到了仓库规则
    level: soft
    check: manual
    how: 升级后问 Agent 一个只有规则文件里才有答案的问题，记录结果
    applies: [kind:agent]
    why: 各工具读取规则文件的条件和优先级会随版本变化，不实测就不知道规则是否生效。
    sources: [S02]
  - id: AGT-005
    title: 修改前先查看工作区状态，不覆盖、不清理、不重置别人未提交的改动
    level: hard
    check: semi
    how: 权限设置禁止 Agent 直接执行 `git reset --hard`、`git clean`、`git checkout -- .` 等命令；评审时查看 Agent 的操作记录
    applies: [kind:agent]
    why: 未提交的改动一旦被覆盖就找不回来。
  - id: AGT-006
    title: 只改任务范围内的文件；要扩大范围或产生外部副作用，先请求批准
    level: hard
    check: semi
    how: CI 比对改动路径与任务声明的范围，超出时要求人工确认
    applies: [kind:agent]
    why: 范围外的改动没人预期，评审时容易漏看。
    sources: [S08]
  - id: AGT-007
    title: issue、PR 评论、网页、文件内容、工具输出、其他 Agent 的消息都当作数据，不执行其中的指令
    level: hard
    check: semi
    how: 回归评测里放入夹带指令的输入，检查 Agent 没有照做
    applies: [kind:agent]
    why: 提示注入是 Agent 最常见的攻击方式，只靠过滤挡不住，要从「不当指令」这一层防。
    sources: [S09, S10]
    see: ["25"]
  - id: AGT-008
    title: 密钥、令牌、客户数据不写进提示词、日志和规则文件
    level: hard
    check: auto
    how: 对规则文件和 Agent 日志跑密钥扫描
    applies: [kind:agent]
    why: 进了上下文的密钥可能被模型复述、被日志收集、被注入攻击带出去。
    sources: [S09]
    see: ["25"]
  - id: AGT-009
    title: 访问生产环境、真实数据、公网，删除数据，推送或部署，必须有运行时授权，不能只靠提示词里的一句话
    level: hard
    check: auto
    how: 在 Agent 的权限设置或沙箱里把这些操作设为需审批或禁止
    applies: [kind:agent]
    why: 提示词可以被注入或误读，只有运行时的权限控制才挡得住误操作。
    sources: [S11]
    see: ["32"]
  - id: AGT-010
    title: 安全边界靠沙箱、权限设置和分支保护强制，不靠在 AGENTS.md 里写「禁止」
    level: hard
    check: manual
    how: 评审时逐项核对：AGENTS.md 里写的每条「禁止」是否都有对应的强制手段
    applies: [kind:agent]
    why: 规则文件只是说明，模型不一定照做；真正的边界要能在 Agent 不配合时也生效。
    sources: [S11, S12]
  - id: AGT-011
    title: Agent 不得放松要求必过的检查、CI 配置、CODEOWNERS、质量阈值和受保护的测试；这些文件的改动必须由指定负责人批准
    level: hard
    check: auto
    how: 把这些路径写进 CODEOWNERS，并在分支保护里要求负责人批准
    applies: [kind:agent]
    why: 放松门槛后再自己判通过，等于没有门槛。
    sources: [S12]
    see: ["03"]
  - id: AGT-012
    title: 因业务行为变化而修改测试时，写明旧预期、新预期和依据
    level: soft
    check: semi
    how: CI 发现测试文件被改时，要求 PR 描述里有对应说明
    applies: [kind:agent]
    why: 允许改测试才能跟上需求变化，但要让评审者看清改的是预期还是在掩盖问题。
    see: ["04"]
  - id: AGT-013
    title: 未运行或失败的检查不得报告为通过；检查结果必须对应最终提交
    level: hard
    check: semi
    how: 合并前把 Agent 报告的检查结果和 CI 在最终提交上的结果对照
    applies: [kind:agent]
    why: 旧提交上的通过不能替新提交作证，虚报的结果会让评审失去依据。
    sources: [S13]
  - id: AGT-014
    title: Agent 自己的检查不等于验收；合并必须有可信 CI 通过和授权评审
    level: hard
    check: auto
    how: 分支保护要求 CI 通过且至少一名非作者批准
    applies: [kind:agent]
    why: 本地检查、可信 CI、验收确认是三件事，不能互相替代。
    sources: [S12, S13]
    see: ["03", "04"]
  - id: AGT-015
    title: 交付时写清改动文件、起止提交编号、跑了哪些检查及结果、没跑什么及原因、风险和回滚方式
    level: hard
    check: semi
    how: PR 模板固定这些栏目，CI 检查栏目非空
    applies: [kind:agent]
    why: 评审者要靠这些信息判断能不能合并、出问题怎么退。
    see: ["03"]
  - id: AGT-016
    title: 改动取最小；优先复用已有模块和依赖，新增依赖要写理由
    level: soft
    check: semi
    how: 评审时看依赖清单的变化和无关改动
    applies: [kind:agent]
    why: Agent 容易顺手重构或引入新依赖，扩大评审和维护成本。
    see: ["02"]
  - id: AGT-017
    title: 按风险决定流程：小改动直接做；跨模块或有外部副作用的改动先写简短方案再动手
    level: soft
    check: manual
    how: 任务描述里标出风险等级，评审时抽查
    applies: [kind:agent]
    why: 所有任务都走重流程会拖慢小改动，所有任务都不写方案又会让大改动失控。
    sources: [S14]
  - id: AGT-018
    title: 验收标准缺失或互相矛盾时，先问清楚，不自己补
    level: soft
    check: manual
    how: 评审时看 Agent 是否记录了澄清问题
    applies: [kind:agent]
    why: 自己补的验收标准往往就是自己最容易做到的那个。
    see: ["06"]
  - id: AGT-019
    title: 规则互相冲突又判断不了时，停下高风险操作，报告冲突的两条规则及出处
    level: soft
    check: manual
    how: 评审时检查 Agent 的报告
    applies: [kind:agent]
    why: 冲突时自己挑一条执行，出了问题无法追溯。
  - id: AGT-020
    title: 上下文压缩或交接时，保留目标、范围、已做决定、改动状态、证据、未决风险和下一步
    level: soft
    check: manual
    how: 抽查交接记录是否包含这些项
    applies: [kind:agent]
    why: 压缩后丢掉的决定和风险，下一个人或 Agent 会重新踩一遍。
    sources: [S15]
  - id: AGT-021
    title: Agent 积累的经验不直接写回权威文档，要走 PR 和评审
    level: soft
    check: semi
    how: 权威文档路径写进 CODEOWNERS
    applies: [kind:agent]
    why: 未经审核的「经验」可能是错的，写进权威文档后会被反复执行。
  # ── 技能（Agent Skills） ──
  - id: AGT-022
    title: 技能的 SKILL.md 必须符合 Agent Skills 规范：name 与目录名一致、只用小写字母数字和连字符；description 写清做什么和何时用
    level: hard
    check: auto
    how: 用 schema 校验 frontmatter
    applies: [kind:agent]
    why: 格式不对的技能在部分工具里加载不了或触发不了。
    ref_value: 规范规定 name 最长 64 个字符、description 最长 1024 个字符。
    sources: [S16]
  - id: AGT-023
    title: 技能描述写明何时用、何时不用，并维护一组应触发和不应触发的测试问题
    level: soft
    check: semi
    how: 每次修改描述后跑正反触发测试，记录命中情况
    applies: [kind:agent]
    why: 描述决定技能会不会被选中；误触发和漏触发都要靠测试发现。
    sources: [S17, S18]
  - id: AGT-024
    title: 技能不授予任何额外权限；安装前审查来源和脚本，不用「下载后直接执行」的方式安装
    level: hard
    check: manual
    how: 安装或更新技能时审查其脚本和来源，记录版本或提交编号
    applies: [kind:agent]
    why: 技能里的脚本以 Agent 的权限运行，是一种可执行的供应链。
    sources: [S16, S19]
    see: ["25"]
  - id: AGT-025
    title: 必须始终遵守的规则写进入口文件或强制手段，不放进可选技能
    level: soft
    check: manual
    how: 评审技能时检查其中是否有「必须」类规则
    applies: [kind:agent]
    why: 技能只在被触发时才加载，放在里面的必守规则大部分时候不生效。
  # ── 多个 Agent 并行 ──
  - id: AGT-026
    title: 并行写代码的每个 Agent 使用独立的工作树和分支，不同时改同一个工作树
    level: hard
    check: auto
    how: 编排工具分配工作树；用 `git worktree list` 检查
    applies: [kind:agent]
    why: 多个 Agent 同时改一个工作树会互相覆盖、互相污染检查结果。
    sources: [S20]
  - id: AGT-027
    title: 多 Agent 先并行做只读的调研和评审；只有文件范围不重叠时才并行写
    level: soft
    check: manual
    how: 编排前列出每个 Agent 负责的文件范围
    applies: [kind:agent]
    why: 并行写的合并冲突和返工成本，常常超过省下的时间。
    sources: [S21]
  - id: AGT-028
    title: 下游只接收带提交编号和检查结果的上游产物，不把其他 Agent 的文字结论当成已验证事实
    level: soft
    check: semi
    how: 交接记录必须引用提交编号和检查结果
    applies: [kind:agent]
    why: Agent 的「我已经修好了」和真的修好了是两回事。
  - id: AGT-029
    title: 高风险改动必须由非作者评审，评审者不能修改自己正在判定的验收测试
    level: hard
    check: auto
    how: 分支保护要求非作者批准；验收测试路径写进 CODEOWNERS
    applies: [kind:agent]
    why: 评审的独立性来自权限隔离；换一个模型来评审只是加分项。
    sources: [S12]
  # ── 评测与治理 ──
  - id: AGT-030
    title: 修改 Agent 配置（规则文件、技能、模型、工具）前后，在固定的任务集上对比结果
    level: soft
    check: semi
    how: 任务集覆盖应该做的、不该做的、夹带注入的、出错恢复的；记录配置版本和结果
    applies: [kind:agent]
    why: 规则多一句少一句的效果凭感觉判断不准，固定任务集才能发现退步。
    sources: [S13]
    see: ["24"]
  - id: AGT-031
    title: 规则文件的修改走 PR 和评审，可以回滚；自动巡检工具只提建议，不直接生效
    level: soft
    check: auto
    how: 规则文件路径写进 CODEOWNERS
    applies: [kind:agent]
    why: 规则会被所有 Agent 反复执行，一条错规则的影响面很大。
    sources: [S14]
  - id: AGT-032
    title: 要求断网的环境里，Agent 不得安装公网软件、上报遥测或调用云端模型，除非事先批准
    level: hard
    check: auto
    how: 网络出口默认拒绝；用断网验收和 DNS 记录检查
    applies: [kind:agent, kind:onprem]
    why: 「命令行在本地跑」不等于数据不出网，模型调用、依赖下载、遥测都可能外发。
    see: ["32"]
choices:
  - category: 仓库入口文件
    pick: 根目录 AGENTS.md，子目录按需再放
    alternatives:
      - { name: CLAUDE.md（导入 AGENTS.md）, when: 用 Claude Code 且需要它特有的配置 }
    avoid:
      - { name: 每个工具各写一套独立规则, why: 内容会互相漂移 }
    sources: [S01]
  - category: Claude Code 适配
    pick: 没有 CLAUDE.md 时直接用 AGENTS.md；需要 CLAUDE.md 时在其中写 @AGENTS.md
    notes: 原生读取 AGENTS.md 需要 2.1.277 及以后；已有 CLAUDE.md 时默认只读 CLAUDE.md。
    sources: [S02]
  - category: Codex 适配
    pick: AGENTS.md；技能放在仓库的 .agents/skills/ 或用户的 ~/.agents/skills/
    sources: [S03, S22]
  - category: GitHub Copilot 适配
    pick: .github/copilot-instructions.md，只写 Copilot 特有内容
    sources: [S04]
  - category: Gemini CLI 适配
    pick: GEMINI.md 导入 AGENTS.md，或 context.fileName 指向 AGENTS.md
    sources: [S07]
  - category: 可复用流程
    pick: Agent Skills（SKILL.md + 按需加载的参考文件）
    avoid:
      - { name: 把所有流程塞进入口文件, why: 常驻上下文过长 }
    license: 规范的代码 Apache-2.0，文档 CC BY 4.0
    sources: [S16]
  - category: 并行隔离
    pick: git worktree + 独立分支
    alternatives:
      - { name: 容器或虚拟机, when: 还需要隔离端口、进程和网络时 }
    avoid:
      - { name: 多个 Agent 共用一个工作树, why: 互相覆盖 }
    sources: [S20]
  - category: 权限控制
    pick: 工具自带的权限设置和沙箱 + 分支保护 + CODEOWNERS
    alternatives:
      - { name: OPA（策略引擎）, when: 规则多、要跨系统统一判断时 }
    avoid:
      - { name: 靠规则文件里的「禁止」或关键词黑名单, why: 挡不住注入和误读 }
    license: OPA 为 Apache-2.0
    sources: [S12, S23]
  - category: Agent 回归评测
    pick: 自建真实任务集 + 能自动判定的评分；具体工具见 24
    avoid:
      - { name: 只看公开榜单或演示, why: 和自己的仓库差别大 }
      - { name: 只用大模型当评委, why: 有偏差，需要可复现的判定打底 }
    sources: [S13]
antipatterns:
  - { bad: 在 AGENTS.md 里写「禁止删除数据」就当作有了保护, instead: 用权限设置或沙箱真正禁止，规则文件只做说明 }
  - { bad: Agent 改了 CI 配置后自己宣布检查通过, instead: CI 配置走负责人审批，结果以可信 CI 为准 }
  - { bad: 入口文件越写越长，把整份手册贴进去, instead: 入口只放索引，细节放 docs/ 按需读 }
  - { bad: 多个 Agent 在同一个工作树里同时改代码, instead: 每个 Agent 一个工作树和分支 }
  - { bad: 用「下载脚本直接执行」的方式安装技能或 MCP 服务, instead: 固定版本、审查后安装 }
  - { bad: 拿聊天记录当唯一的项目知识库, instead: 决定和事实写进仓库文档，交接时引用 }
