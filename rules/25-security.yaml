open_questions:
  - CISA BOD 22-01 已被撤销、由 BOD 26-04 取代（官方页面注明），新指令对 KEV 漏洞的修复期限尚未核实；SEC-007 的「两周」参考值待按新指令更新
  - Betterleaks 2026 年 3 月才发布，第三方资料对其最新版本和许可证说法不一（官方仓库 2026-11-14 显示 MIT）；与 Gitleaks 配置的兼容程度、误报率待实测
  - Trivy 2026 年 3 月事件（CVE-2026-33634）的处置是否彻底、后续发布是否全部带签名，待跟进官方公告；Aqua 官方博客本次未能直接打开
  - OWASP LLM Top 10 2026 各条编号与名称（除第一位提示注入、第二位敏感信息泄露、第三位过度代理外）未逐条核对原文；正式发布日期有 2026-08-04 与随 Agent Control Standard 在 9 月发布两种说法
  - OWASP Top 10:2025 的正式定稿日期未核实
  - OWASP AISVS 1.0、OWASP Agent Control Standard 的内容和发布日期未核实，暂未写进规则
  - CodeQL 用于私有商业仓库的授权条件未核实（报告给出的依据链接可疑）
  - NIST SSDF 是否已有新修订版未核实
  - SLSA v1.2 的确切发布日（官方博客只到 2025 年 11 月）未核实
  - Semgrep 社区版与付费版的功能分界（如跨文件分析）未核实
  - 待补调研：WAF 选型（自托管与云 WAF、ModSecurity/Coraza 与 OWASP CRS）
  - 待补调研：模糊测试、策略引擎（OPA/Conftest/Kyverno）、IaC 专用扫描（Checkov、KICS）、AI 红队工具（garak、PyRIT、promptfoo 等）的选型
  - 待补调研：OSV-Scanner、Trivy、Grype 在断网环境下的误报率与漏洞库同步方式对比
  - 待补调研：漏洞修复时限的更多外部参照（如 PCI DSS 对严重补丁的要求）
