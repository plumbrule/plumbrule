open_questions:
  - 报告所写的当前工具链版本（Xcode 27.2、Swift 6.4.2）未联网核实；规则不依赖具体版本，版本账本另行维护。
  - 报告称 Xcode 27 引入 JSON 格式的工程配置文件，来源只有一句，未核实；核实后再决定是否影响「工程文件入库与评审」的做法。
  - 报告称 2026-06 App Store 统计中 79% 的 iPhone 在 iOS 26，未核实，未写入规则。
  - CocoaPods 主仓（trunk）转只读的计划和日期未核实；核实后可作为「新项目不用 CocoaPods」的更强理由。
  - SwiftLint 的许可证（MIT）与维护状况本次未联网复核；swift-format 随 Xcode 工具链提供的说法来自 2024 年起的社区资料，未找到 Apple 官方文档页。
  - Apple Business 平台下「自定义 App」分发的具体名称和流程是否有变化，未在 Apple 官方文档确认。
  - Swift Testing 与 XCTest 在新版 Xcode 中的互操作细节（社区称默认开启）未在 Apple 官方文档确认。
  - 待补调研：导航（NavigationStack 与路由组织）的默认做法。
  - 待补调研：依赖注入是否推荐现成库（与 29 Android 的 Hilt 对照）。
  - 待补调研：日志（OSLog）、崩溃与性能（MetricKit）在 iOS 侧的落地。
  - 待补调研：内购（StoreKit 2）与订阅的工程规范。
  - 待补调研：深链与通用链接（Universal Links）、Sign in with Apple 的审核要求。
  - 待补调研：工程生成工具（Tuist、XcodeGen）是否推荐。
  - 待补调研：跨平台项目（React Native、Flutter）iOS 侧从 CocoaPods 迁到 SPM、隐私清单合并的具体做法。
