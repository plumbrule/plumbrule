open_questions:
  - Android 开发者验证首批生效国家：官方页面写印度尼西亚、新加坡、泰国，部分报道还包括巴西；对中国大陆非 Google 认证设备和国内应用市场分发是否有影响，待确认
  - Google Play 对照片和视频权限的政策（只有核心功能才可申请 READ_MEDIA_* ）的当前条款未逐条核实；核实后 AND-016 可考虑升为硬约束
  - Navigation 3 已发布稳定版、Room 新大版本发布线的现状来自原报告，未重新核实
  - Kotlin 官方 Gradle/AGP 兼容表当前覆盖到哪个 AGP 版本，未重新核实（AGP 当前大版本为 9，已核实）
  - detekt 对当前 Kotlin 版本的支持情况、ktlint 维护节奏，未核实
  - Gradle Play Publisher、fastlane、Coil、Koin、Roborazzi、Paparazzi 等第三方库的许可证未从官方仓库 LICENSE 逐个核实（原报告对 Gradle Play Publisher 写 Apache-2.0，待确认）
  - 小米推送通道 2026-12-31 的策略变化节点（原报告提及，细节未核实），归 28 跟踪
  - 待补调研：OPPO、vivo、荣耀应用市场的上架审核规则
  - 待补调研：崩溃上报与日志库的 Android 侧选型（国内外方案、私有化部署）
  - 待补调研：Baseline Profile、Macrobenchmark、截图测试工具的成熟度与 CI 接入方式
