open_questions:
  - Atlas MSA 的具体条款（再分发、商业使用、是否需要联网登录）未读原文；在断网环境用标准版前要确认
  - GORM、Bun、Ent、testify、zap 的许可证和维护状态未在本主题核实
  - google/wire 已归档（2025-08 前后），只从仓库归档标记确认，未查归档公告
  - 原报告关于 Go 新版本特性（泛型方法、encoding/json/v2、goroutineleak profile 转正）的说法只有一个来源，未核实，未写进规则
  - gosec 规则编号（G112、G114、G201、G202）以 gosec 仓库为准，未逐条复核
  - 待补调研：国内网络下的 Go 模块代理（如 goproxy.cn）可用性与私有化镜像方案
  - 待补调研：CLI（flag 与 cobra）和可复用 SDK 的依赖与发布写法
  - 待补调研：openGauss 等「PostgreSQL 兼容」数据库与 pgx、sqlc、goose 的实际兼容情况
