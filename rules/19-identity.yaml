open_questions:
  - 本轮未逐个核实的许可证：authentik（社区版 MIT、企业版模块商业许可）、Logto（MPL-2.0）、Casdoor、Ory Hydra/Kratos/Keto、OpenFGA、SpiceDB、Cerbos、OPA、SPIRE（均据报告为 Apache-2.0）；发布前按各仓库 LICENSE 核实
  - Casbin Go 主仓库是否已迁到 apache/casbin，仓库地址和许可证待核实
  - ZITADEL 改为 AGPL 的确切生效日期（第三方资料说法不一，官方说明以 v3 为界）
  - NIST SP 800-63B-4 的正式发布日期，以及连续失败尝试次数上限的具体条款，待逐字核实
  - OWASP 会话备忘单对空闲超时和绝对超时的建议区间待核实（报告给的 30 分钟 / 12 小时没有出处，已不采用）
  - 通行密钥在信创终端、国产浏览器和内网域名下的支持情况，待补调研
  - 待补调研：各语言的落地库（OIDC 客户端、JWT 校验、WebAuthn 服务端、会话中间件、Argon2 实现）及许可证，或交由 10–14 各语言主题
  - 待补调研：飞书、钉钉、企业微信登录的字段映射建议；钉钉、企业微信需改用官方文档作为出处
  - 待补调研：身份提供方与国产数据库、信创 CPU/操作系统的兼容性实测
  - 待补调研：SAML 校验清单的权威出处
