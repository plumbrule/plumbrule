open_questions:
  - 当前 Java LTS 为 Java 25，下一个 LTS 按 Oracle 路线图为 Java 29（2027-09，路线图注明可能变化）；Oracle JDK 21 在 2026-09 之后的更新改用 OTN 许可。以上来自 Oracle 路线图，版本号不写进规则，由版本账本跟踪
  - Spring Boot 各版本线的具体支持截止日期（如 4.0、4.1）只从第三方汇总页看到，未在官方支持表逐条核对；规则只引用官方政策（每个小版本线至少 13 个月开源支持）
  - Gradle 当前大版本为 9（官方发布说明核实）；原报告「Kotlin 插件完整支持的 Gradle 上限低于最新 Gradle」的具体上限未在 Kotlin 官方兼容表复核，升级时以兼容表为准
  - Flyway 社区版仍为 Apache-2.0、Redgate 维护；Teams / Enterprise 的现行功能划分和哪些数据库需要付费版，只从较早的 Redgate 页面看到，未核实 2026 年的现状
  - Liquibase FSL 对「把 Liquibase 随产品一起分发给客户」是否构成竞争性使用，官方博客没有直接说明；私有化交付要随产品带上 Liquibase 时，需按 27 的口径单独确认
  - Spring Cloud Alibaba 当前版本对新 Spring Boot 版本线的兼容情况（原报告称只覆盖较早的一条版本线）未复核
  - 原报告的 Seata、Nacos、Dubbo、Testcontainers 等版本与日期存在自相矛盾或未核实，均未写入；中间件选型见 18
  - EasyExcel、Valiktor、QuickTheories 的维护状态未核实（疑似停止维护），未写入选型
  - 选型中的许可证：Hibernate、Liquibase、Flyway 已按官方说明核实，其余按 GitHub 仓库的 LICENSE 识别结果填写（google-java-format、PMD、Logback、jOOQ 的仓库未给出标准识别，按官方说明填写），未逐个阅读许可全文
  - 2026-11-14 新增的来源（S03、S08、S10、S11–S15、S19、S20、S26–S32、S34、S35、S37–S43、S46–S50、S56–S58、S60）只确认链接有效且为官方入口，未逐页核对与规则对应的具体段落
  - 待补调研：Spring Boot 最新大版本和 Spring Framework 大版本的系统性变化（Jakarta EE 基线、空值注解、starter 改名等），原报告只讲了 Jackson 3 和 starter 改名
  - 待补调研：Gradle 版的 Spring Boot / Ktor 服务模板和 Maven 版库模板，需实际构建通过后再发布
  - 待补调研：国产 JDK 发行版（面向国产 CPU 的发行版）的支持期与更新节奏；阿里巴巴 Java 开发手册中可直接采纳的条目
  - 待补调研：容器中 JVM 的内存与 CPU 参数（按容器限额设置堆大小等）缺少有出处的建议
