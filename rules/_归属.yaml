归属:
  - { 事项: 格式化与 lint 的通用原则（单一格式器、例外要有理由和到期日）, 主题: "02" }
  - { 事项: 各语言具体的格式化、lint、测试、构建工具, 主题: "10-15" }
  - { 事项: 日志字段、错误传播、命名等跨语言编码约定, 主题: "02" }
  - { 事项: 测试分层、覆盖率口径、不稳定测试、验收证据, 主题: "04" }
  - { 事项: 移动端和桌面端的 E2E 工具, 主题: "28-31" }
  - { 事项: 分支、提交信息、PR、评审、CI 门禁顺序、发布流程, 主题: "03" }
  - { 事项: 面向用户的变更日志写法, 主题: "05", 备注: 提交信息生成草稿，人工改写给用户看的部分 }
  - { 事项: README、ADR、文档站、图表工具, 主题: "05" }
  - { 事项: AGENTS.md 的范围与写法、Agent 权限、Agent 不得自我验收, 主题: "23" }
  - { 事项: 需求、验收标准、优先级与任务状态, 主题: "06" }
  - { 事项: 组件库、前端框架、前端 i18n 库, 主题: "07" }
  - { 事项: 视觉令牌（颜色、字号、间距、动效时长）, 主题: "08" }
  - { 事项: 对比度、触控尺寸、减少动效、键盘、读屏、国际化行为, 主题: "09" }
  - { 事项: 接口风格、OpenAPI、错误格式（RFC 9457）、幂等语义、分页、版本、webhook 发布与签名、事件格式、MCP, 主题: "16" }
  - { 事项: 数据建模、迁移原则、事务与隔离级别、乐观锁、租约、outbox 表、备份与恢复演练、向量存储, 主题: "17" }
  - { 事项: 数据库迁移工具, 主题: "10-15", 备注: 原则在 17，工具按语言选 }
  - { 事项: 缓存、消息队列、搜索、任务调度与工作流、分布式锁、限流, 主题: "18" }
  - { 事项: 登录、会话、令牌、授权模型、多租户隔离, 主题: "19" }
  - { 事项: 不可信文件的解析与转换, 主题: "20", 备注: 上传安全的通用规则在 25 }
  - { 事项: 接收第三方回调、各渠道通知、OAuth 接入第三方账号, 主题: "21" }
  - { 事项: 埋点、指标、数据仓库、实验、通用成本账本, 主题: "22" }
  - { 事项: 模型选择、网关、提示词、评测工具、RAG 切块与检索、模型计价, 主题: "24" }
  - { 事项: 威胁建模、密钥管理与扫描、SAST、SCA、SBOM、签名与来源证明、SSRF、上传安全、WAF, 主题: "25" }
  - { 事项: 部署、容器镜像、可观测性（OTel）、告警、SLO、事故响应、值班, 主题: "26" }
  - { 事项: 法规、隐私设计、开源许可口径与许可扫描工具、数据出境, 主题: "27" }
  - { 事项: 跨端选型、代码共享、离线同步、推送总体架构, 主题: "28" }
  - { 事项: Android 平台细节（含 Gradle/AGP 基线）, 主题: "29" }
  - { 事项: iOS 平台细节, 主题: "30" }
  - { 事项: JVM 服务端的 Gradle/Maven 基线, 主题: "14" }
  - { 事项: 桌面框架、签名公证、打包与自动更新, 主题: "31" }
  - { 事项: 本机沙箱、出口代理、进程回收、本机 HTTP 服务防护, 主题: "32" }
