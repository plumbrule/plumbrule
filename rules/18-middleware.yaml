open_questions:
  - MinIO 社区版仓库归档的确切日期：多方说法为 2025-12 进入维护模式、2026-02 首次归档、2026-04 再次归档；GitHub 当前显示已归档，具体日期以 MinIO 官方说明为准。客户端 mc 是否也已归档未核实。
  - Dragonfly：DSAL 原文已核实（生产合计 100 vCPU 上限、不得作为独立产品再分发），但「2.1 版起改用 DSAL」的版本分界和旧版 BSL 的适用范围未核实；是否有用量上报也未核实。
  - Redpanda 的 GitHub 主仓库显示为已归档，可能是迁移了仓库或改变了开源策略，社区版的现状和许可证待核实。
  - 以下许可证沿用原调研或只看了 GitHub 识别结果，未逐一读官方 LICENSE：RabbitMQ（MPL-2.0）、Meilisearch 社区版与企业版边界、pg_bigm、Ceph（LGPL 组合）、JobRunr（开源版 LGPL-3.0，Pro 版商业）、Inngest（SSPL 加延迟转 Apache-2.0）、Kafka/Pulsar/RocketMQ/Airflow（Apache-2.0）、Hatchet 服务端的社区版与商业版边界。
  - Camunda 8 自托管生产使用是否需要商业授权，待核实；若需要，Java 的 BPMN 场景默认 Flowable。
  - 待补调研：Redis Streams、RabbitMQ Streams 作为轻量事件流的适用边界。
  - 待补调研：Rust 的 PostgreSQL 任务队列库（如 apalis）成熟度；JVM 的 Quartz、PowerJob、DolphinScheduler 对比；Camunda / Flowable 的选型。
  - 待补调研：限流的网关产品（Envoy 全局限流、NGINX、APISIX 等）和各语言限流库。
  - 待补调研：etcd、ZooKeeper 作为锁与协调服务的使用要求。
  - 待补调研：中文搜索的 IK 分词插件、pg_jieba、zhparser 的维护状态、许可证（含 SCWS 词典）和在国产数据库上的兼容性；各引擎中文效果没有实测对比。
  - 待补调研：自建对象存储（Ceph RGW、SeaweedFS、Garage 等）的成熟度、运维成本和迁移方案。
  - 待补调研：数据库任务队列何时该换专用队列的量化信号（原调研给的「超过任务时限 20%」「3 个观察窗口」没有出处，未采用）。
