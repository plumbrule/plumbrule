open_questions:
  - 动效参考缓动 `cubic-bezier(0.2, 0, 0, 1)` 是否与 Material 3 的 standard 缓动取值相同，未核实
  - Figma Variables REST API 的写入接口是否仅限 Enterprise 套餐，未核实最新条款
  - Tokens Studio 插件、Terrazzo、Phosphor 的许可证未从官方 LICENSE 核实
  - SF Symbols 的使用授权范围（是否仅限 Apple 平台）未核实原文条款
  - Lucide 中源自 Feather 的图标需要保留哪些声明（ISC 与 MIT 并存），官方讨论未定论
  - Penpot 在断网环境中的完整安装和外部服务关闭方式未实测
  - 待补调研：空状态、加载、骨架屏等视觉状态的参考做法和尺寸
  - 待补调研：插画风格与素材来源的可参考方案
  - 待补调研：Terrazzo 与 Style Dictionary 对 DTCG 新特性支持程度的对比
  - 待补调研：Linux 桌面应用图标的交付规范
  - 待补调研：选定组件库后令牌接入其主题机制的具体做法（与 07 一起定）
