open_questions:
  - GitHub 合并队列对哪些仓库和套餐开放：官方页面未写明，启用前按所用套餐核实
  - GitHub Enterprise Server 能否在完全断网下使用 Actions、缓存和包仓库，需单独核实
  - Lefthook、pre-commit、commitlint、Changesets、semantic-release、GoReleaser 的许可证沿用原调研，未逐一对照官方 LICENSE 核实；GoReleaser 商业版与开源版的功能边界未核实
  - Renovate 许可证是 AGPL-3.0-only 还是 or-later：LICENSE 文件为 AGPL v3 全文，需对照 package.json 的声明确认
  - Gitea 稳定版文档中受保护分支的签名提交、批准规则细节，原调研引用的是开发版文档，需对照实际部署版本核实
  - GitLab 各套餐（免费版、Premium、Ultimate）与社区版、企业版许可证的对应关系，原调研说法较简化
  - 待补调研：monorepo 构建与任务工具（Nx、Turborepo、Bazel、Pants）的选型，或明确交给 10
  - 待补调研：堆叠 PR 的工具与做法（如 Graphite、ghstack、git-town）
  - 待补调研：各平台角色与权限级别的对应关系（GitHub 的 write/maintain、GitLab 的 Developer/Maintainer、Gitea 的权限）
  - 待补调研：Forgejo 与 Gitea 的能力差异
  - 待补调研：流程质量指标（首次评审响应时间、PR 周期、返工率、合并后回滚率）的统计口径，需与 22 对齐
  - 待补调研：Lefthook 与 pre-commit 的默认选择需与 02、12 统一口径
