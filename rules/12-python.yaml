open_questions:
  - OpenAI 收购 Astral 是否已完成交割、之后 uv/Ruff/ty 的治理和许可是否变化（2026-03-19 宣布时需监管审批，未查到交割公告）
  - pydantic.v1 兼容层在较新 Python 版本上是否仍可用（版本策略页未说明）；Pydantic V3 的时间表
  - uv_build 构建后端是否已标为稳定、适合作为默认（未核实）
  - 许可证沿用原调研、未逐一对照官方 LICENSE 核实：uv、Hatchling、mypy、Pyright、Django、Flask、SQLAlchemy、psycopg、Alembic、Celery、RQ、Dramatiq、pytest、Hypothesis、pip-audit、structlog
  - Ruff 规则编号（PGH003/PGH004、RUF006、ASYNC210/251、S113 等）按原调研和既有知识写出，未逐条对照当前规则页核实
  - 国产数据库（openGauss、达梦、人大金仓等）与 psycopg 3、SQLAlchemy、Alembic 的兼容性：待补调研
  - 待补调研：Python 变异测试工具（如 mutmut、cosmic-ray）的成熟度与推荐
  - 待补调研：FastAPI 导出 OpenAPI 后的破坏性变更检查工具（与 16 一起定）
