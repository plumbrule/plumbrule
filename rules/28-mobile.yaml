open_questions:
  - Expo 当前最新 SDK 与对应 React Native 版本（原报告称 SDK 58 / RN 0.88，本次只核实到 SDK 55 起强制新架构、RN 0.82 起移除旧架构）
  - Flutter 当前稳定版及渲染引擎现状（原报告称 3.50 / Dart 3.14，未核实）
  - Apple 开发者协议 3.3.1(B) 关于解释执行代码的现行原文（本次只核实审核指南 2.5.2 的大意）
  - Flutter 热更新方案（如 Shorebird）在应用商店政策下的适用边界
  - EAS Update 自托管的官方支持范围；自托管 CodePush 服务端仓库是否已归档
  - Detox、Patrol、Appium 的许可证与维护状态（以官方仓库 LICENSE 为准）
  - Sentry 自托管 FSL 许可的现行条款（沿用原报告，未重新核实）
  - 鸿蒙开发套件的版本命名与稳定基线（原报告称 26.0.1 Beta1，命名方式存疑）
  - 待补调研：统一推送联盟的现状和各厂商支持情况
  - 待补调研：国内崩溃与性能监控方案（含可私有化的），国内应用市场（华为、小米、OPPO、vivo）上架材料
  - 待补调研：应用内统计埋点 SDK 选型（与 22 协调）
  - 待补调研：小程序（Taro、uni-app）和鸿蒙的工程模板与维护状态
