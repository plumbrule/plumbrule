open_questions:
  - Next.js 当前主版本状态与自托管要求本次未联网核实（原报告写 Next.js 16）。
  - Radix Primitives 的维护活跃度不明：第三方比较称其发布变慢，未找到官方路线图；新项目默认推荐 Base UI 部分基于此。
  - Tailwind Labs 据媒体报道于 2026-09 被 Shopify 收购、框架继续以 MIT 开源，未找到官方公告核实。
  - React 移交 Linux 基金会下的 React 基金会，只见单一社区来源，未核实官方公告。
  - Base UI 1.0 稳定版发布时间（据报道为 2025-12）未在官方发布页核实。
  - 除 Tailwind 外，各库许可证取自原报告快照，未逐一到官方仓库 LICENSE 核实；Sentry 自托管、GlitchTip、tldraw、ONLYOFFICE、Collabora 的许可需单独核实。
  - Remix 新版仍处预发布，其与 React Router 的定位关系需在正式版发布后复核。
  - 包体积预算 170/80/250 KB 为自拟草案，待补调研：业界常用的前端包体积预算依据。
  - 待补调研：管理后台（Ant Design）、Vue、嵌入式组件的依赖清单示例。
  - 待补调研：微前端何时用、用什么。
  - 待补调研：浏览器终端（如 xterm.js）的选型与安全边界。
  - 待补调研：国产操作系统和浏览器内核上的前端兼容性测试做法。
