id: "07"
slug: web
title: Web 前端
summary: Web 前端怎么选型和组织：框架与构建、何时用 SSR/SSG、路由、数据请求与缓存、状态、表单、组件库、样式、图表与编辑器等重型功能、前端监控、包体积与性能，以及私有化部署下的资源本地化。
status: draft
reviewed_on: 2026-11-14
next_review: 2027-02-14
scope:
  includes:
    - 项目类型与框架、构建工具选型；SSR/SSG 何时用
    - 路由、数据请求与缓存、界面状态、表单
    - 基础组件库与业务组件库选型、复制组件的维护
    - 样式方案、图标、前端国际化库
    - 表格、虚拟列表、拖拽、图表、代码编辑、Markdown、富文本、协同、白板、上传、PDF/Office 预览
    - 实时连接（SSE/WebSocket）的客户端处理
    - 前端错误监控、真实用户性能监控、包体积预算与加载性能
    - 前端的 XSS、令牌存储、CSP 兼容等前端侧要求
    - 私有化与断网部署下的前端资源本地化
    - 嵌入式组件（widget）与可复用组件库的打包
  excludes:
    - { what: tsconfig 严格选项、lint 与格式化工具、包管理器与锁文件、单元测试库, see: "10" }
    - { what: 格式化与 lint 的通用原则, see: "02" }
    - { what: 视觉令牌（颜色、字号、间距、动效时长）与设计系统, see: "08" }
    - { what: 对比度、键盘操作、读屏、焦点、减少动效、日期与数字的本地化显示, see: "09" }
    - { what: OpenAPI 契约与客户端生成器的语义、错误格式、分页、事件格式, see: "16" }
    - { what: 测试分层、E2E 工具与视觉回归原则, see: "04" }
    - { what: 登录、会话、令牌签发、CSRF 方案、授权模型, see: "19" }
    - { what: CSP、XSS 防护、上传安全、依赖漏洞扫描的通用规则, see: "25" }
    - { what: 不可信文件的解析与服务端转换, see: "20" }
    - { what: 发布、可观测性平台、告警, see: "26" }
    - { what: 开源许可口径、数据出境与隐私法规, see: "27" }
    - { what: 依赖升级与评审流程、ADR 写法, see: "03" }
overview: |
  1. **先定项目类型，再选框架。** 登录后的应用、管理后台、内容站、需要 SSR 的站点、嵌入式组件、组件库，各有默认选型；选择和拒绝的理由写进 ADR（架构决策记录）。
  2. **登录后应用默认静态 SPA。** React + TypeScript + Vite + TanStack Router + TanStack Query，部署成静态文件，后端独立提供 API。公开内容站默认 Astro 静态生成。只有确实需要个性化 SSR 时才上 Next.js、React Router 框架模式或 TanStack Start，并把服务端运维和安全更新算进成本。
  3. **数据各归其位。** 能从 URL 重建的状态放路由参数，服务器数据放请求缓存库，临时界面状态放组件内；不要把服务器实体复制进全局 store。
  4. **一个应用一套。** 一套路由、一套基础组件库、一套样式方案、一个 HTTP 客户端层。
  5. **不自己造基础设施。** 可访问的弹层和下拉、虚拟列表、复杂表格、拖拽、日期时区、HTML 净化、富文本、CRDT、代码编辑器、PDF 渲染都用成熟库。
  6. **安全底线。** 不可信 HTML 不直接注入；令牌不进 localStorage；构建产物能在严格 CSP 下运行；权限和上传校验以服务端为准。
  7. **重的按需加载。** 编辑器、图表、PDF、白板只在用到的路由或交互里加载；首屏和主要路由设包体积预算。
  8. **按真实用户测性能。** 用 P75 的 LCP、INP、CLS 衡量，实验室跑分不能代替。
  9. **私有化就全部本地。** 字体、图标、Worker、样式随应用内置，监控数据不出客户网络，在断网环境实际验收。
rules:
  # ── 选型与结构 ──
  - id: WEB-001
    title: 每个前端项目在 ADR 里写明项目类型（SPA、后台、内容站、SSR 站点、嵌入式组件、组件库）以及选用和放弃的框架
    level: soft
    check: semi
    how: CI 检查仓库里有前端选型 ADR；评审时看新项目是否说明了放弃的选项
    applies: [platform:web]
    why: 惯性选型常在后期才暴露问题，比如为不需要 SEO 的后台引入 SSR，多出服务端运维和缓存治理。
    see: ["03", "05"]
  - id: WEB-002
    title: 登录后才能用的应用默认构建为静态 SPA；公开可索引的内容默认静态生成；只有需要个性化服务端渲染时才用 SSR 框架
    level: soft
    check: manual
    how: 评审选型 ADR 时核对：选 SSR 的理由是否具体（SEO 的个性化页面、首屏数据必须服务端取），是否评估了部署、缓存一致性和安全更新
    applies: [platform:web]
    why: SSR 带来 Node 服务、多实例缓存一致性和服务端组件安全更新等运维负担；登录后应用通常不需要 SEO。
    detail: |
      - 静态 SPA 部署时，静态服务器要配置 history 回退（未知路径返回 index.html）。
      - 官网和应用同域不等于必须同一框架：`www` 用 Astro、`app` 用 Vite SPA，共享设计令牌和身份服务即可。
      - 公开页面多且需要个性化时，用真实样板工程对比 Astro、Next.js、React Router 框架模式和 TanStack Start，而不是只比构建速度。
    sources: [S05, S32, S36]
  - id: WEB-003
    title: 一个应用只用一套路由库，不混用两套路由
    level: soft
    check: auto
    how: CI 检查依赖清单里同时出现多个路由库（如 react-router 和 @tanstack/react-router）时报错
    applies: [platform:web]
    why: 两套路由的导航、数据加载和 URL 语义不一致，链接和返回行为会出错。
    sources: [S06]
  - id: WEB-004
    title: 筛选、排序、分页、当前标签页等能从 URL 重建的视图状态放进路由的查询参数
    level: soft
    check: manual
    how: 评审时检查：刷新页面或分享链接后视图是否还原
    applies: [platform:web]
    why: 放在内存里的视图状态刷新就丢，也无法分享和回退。
    sources: [S06]
  - id: WEB-005
    title: 服务器数据交给请求缓存库或框架的 loader 管理，不复制进全局 store
    level: soft
    check: semi
    how: 评审时检查全局 store 里是否存放了接口返回的实体列表；确需复制的写明理由
    applies: [platform:web]
    why: 复制出来的数据会过期，失效、重试、乐观更新都要自己再实现一遍。
    detail: |
      状态归属：
      - URL 可重建的视图 → 路由查询参数
      - 服务器实体（列表、详情、权限快照）→ 请求缓存库或 loader
      - 纯本地临时状态（弹层开关、表单中间值）→ 组件内 state
      - 跨视图共享的轻量客户端状态（布局偏好、命令面板开关）→ context 或轻量 store
      - 会话与权限 → 服务端为准，前端只持有展示用的副本
    sources: [S07, S37]
  - id: WEB-006
    title: 所有接口调用经过统一的 HTTP 客户端层，鉴权、错误转换、超时和重试只在这一层实现
    level: soft
    check: auto
    how: 用 lint 的 import 限制规则禁止在客户端层以外直接调用 fetch 或引入 HTTP 库
    applies: [platform:web]
    why: 每个页面各写一套 401 处理和重试，会导致认证行为分叉和重试风暴。
  - id: WEB-007
    title: 后端提供 OpenAPI 契约时，前端的接口类型从契约生成，生成文件不手改
    level: hard
    check: auto
    how: CI 重新运行生成命令后执行 `git diff --exit-code`，有差异即失败
    applies: [platform:web]
    why: 手写的接口类型会和后端悄悄漂移，错误要到运行时才暴露。
    sources: [S35]
    see: ["16", "10"]
  - id: WEB-008
    title: 新增依赖前登记用途、备选、许可证、维护状态、包体积影响和需要的外部资源
    level: soft
    check: semi
    how: PR 模板要求填写；CI 发现依赖清单新增直接依赖时检查 PR 描述是否有登记
    applies: [platform:web]
    why: 前端依赖增长快，事后很难说清每个包为什么在、能不能删。
    see: ["03"]
  - id: WEB-009
    title: 商业许可、强 copyleft 或已归档的包未经许可审查不得引入；同一项目的免费版和付费版功能要分清
    level: hard
    check: auto
    how: CI 对锁文件跑许可证扫描，命中禁用或待审许可证即失败；评审时核对精确包名
    applies: [platform:web]
    why: 名字相近的包可能许可和维护状态完全不同；付费功能误当免费用有法律风险。
    detail: |
      常见坑：
      - `react-pdf`（wojtekmaj，MIT）和 `react-pdf-viewer`（已归档、商业许可）是两个项目。
      - AG Grid 社区版是 MIT，企业版功能需要商业许可；Tiptap 核心是 MIT，Pro 扩展和云服务另有条款。
      - tldraw、在线 Office 预览服务的许可要逐项审查。
    sources: [S13, S17, S21, S22]
    see: ["27"]
  - id: WEB-010
    title: 依赖的主版本升级单独提 PR，写明影响范围、迁移步骤和回滚方式，并跑完整 E2E；不批量升级多个主版本
    level: soft
    check: semi
    how: CI 发现依赖主版本变化时，要求 PR 描述包含迁移和回滚小节
    applies: [platform:web]
    why: 前端库的主版本常有不兼容的 API 变化（如 TanStack Table 新主版本与旧版不兼容），混在一起升级出问题时无法定位。
    sources: [S14]
    see: ["03"]
  # ── 组件与交互 ──
  - id: WEB-011
    title: 对话框、菜单、弹出层、下拉选择、组合框等交互组件，基于成熟的可访问基础组件库实现，不自己写焦点管理和键盘交互
    level: hard
    check: semi
    how: 评审时检查新组件里是否手写了焦点陷阱、`role="dialog"`、方向键导航等逻辑；有则要求改用基础组件库
    applies: [platform:web]
    why: 焦点、键盘、遮罩滚动、层级这些行为细节多，自己写几乎一定漏掉读屏和键盘用户。
    sources: [S09, S10, S11]
    see: ["09"]
  - id: WEB-012
    title: 同一应用的公共组件层只用一套基础组件库，不混用多套
    level: soft
    check: auto
    how: CI 检查依赖清单里同时出现多套基础组件库（如 Base UI、Radix、React Aria、Ark UI）时报错，例外要有 ADR
    applies: [platform:web]
    why: 不同库的事件模型、样式接口和可访问实现不一致，组合起来行为难以预测。
  - id: WEB-013
    title: 以源码方式复制进仓库的组件（如 shadcn/ui）登记上游来源、引入时的版本和本地修改；业务页面复用公共组件，不另复制变体
    level: soft
    check: semi
    how: 维护一份组件清单文件；CI 检查公共组件目录里的文件都在清单中
    applies: [platform:web]
    why: 复制源码换来了定制自由，代价是上游修复不会自动到达；不登记就没法升级。
    sources: [S08]
    see: ["08"]
  - id: WEB-014
    title: 虚拟列表、复杂表格、拖拽排序、日期时区计算、富文本、协同编辑、代码编辑器、PDF 渲染、终端模拟用成熟库，不自己实现
    level: soft
    check: manual
    how: 评审时识别自研的此类实现；确需自研的，先写一份「自研还是采用」的决策记录，列出候选库、缺口、测试和负责人
    applies: [platform:web]
    why: 这些领域边界情况极多（动态行高、输入法、时区和夏令时、选区和撤销），自研的成本和缺陷远超预期。
    detail: |
      可以自己写的：具体业务流程、页面布局、简单展示组件、接口适配和数据转换、与业务语义绑定的交互。
  - id: WEB-015
    title: 一个应用只用一套主样式方案；全局样式只在应用入口定义
    level: soft
    check: semi
    how: 评审时检查是否同时引入多套原子类框架或 CSS-in-JS 库；lint 限制全局样式只能在入口文件引入
    applies: [platform:web]
    why: 多套样式方案叠加会造成优先级冲突和体积膨胀。
    see: ["08"]
  - id: WEB-016
    title: 界面文案不硬编码在组件里，统一走 i18n 库；语言包随应用打包，不在运行时请求公网翻译服务
    level: soft
    check: semi
    how: lint 规则查找 JSX 里的裸文本字面量；构建产物 URL 扫描
    applies: [platform:web]
    why: 硬编码文案后续无法翻译；在线翻译服务在内网和断网环境不可用。
    see: ["09"]
  # ── 健壮性 ──
  - id: WEB-017
    title: 每个数据请求处理加载中、空结果、错误三种状态，并在离开页面时取消未完成的请求；每个路由有错误边界
    level: soft
    check: semi
    how: 组件测试用接口模拟返回空和错误；评审时检查请求是否接入取消信号
    applies: [platform:web]
    why: 只处理成功路径的页面，在网络慢或接口出错时会白屏或显示过期数据。
  - id: WEB-018
    title: 关键用户流程的 E2E 覆盖六种状态：成功、空结果、接口错误、超时、无权限、断网
    level: soft
    check: auto
    how: 用 E2E 框架的网络拦截模拟各状态；CI 检查关键流程的测试用例齐全
    applies: [platform:web]
    why: 只测成功路径，最常见的故障场景就没人验证过。
    ref_value: 六种状态是本规范统一的口径，取代原调研中「正常/超时/无权限」等多种说法。
    see: ["04"]
  - id: WEB-019
    title: SSE 和 WebSocket 连接集中在通信层管理：断线指数退避加随机抖动重连、认证失效时重新认证、按事件编号去重，服务端支持时用游标续传
    level: soft
    check: semi
    how: 测试里模拟断线、重复和乱序事件；评审时检查组件内是否直接创建连接
    applies: [platform:web]
    why: 组件里各自开连接容易重复订阅、内存泄漏；不退避的重连会在服务恢复时形成风暴。
    see: ["16"]
  - id: WEB-020
    title: 日期时间用日期库或 Intl 处理；接口传输带时区偏移的 ISO 8601 字符串，不用 `new Date('YYYY-MM-DD')` 做业务计算
    level: soft
    check: semi
    how: lint 规则查找对日期字符串直接 `new Date()` 的用法；测试在固定时区和夏令时切换日运行
    applies: [platform:web]
    why: 不带时区的日期字符串在不同浏览器和时区下解析结果不同，常导致差一天的错误。
    see: ["09", "16"]
  # ── 安全 ──
  - id: WEB-021
    title: 不可信的 HTML 和 Markdown 不得未经净化注入 DOM；Markdown 渲染默认禁用原生 HTML，并校验链接协议
    level: hard
    check: auto
    how: lint 禁用 `dangerouslySetInnerHTML`、`innerHTML`、`v-html`，例外只允许经过净化函数的调用点；安全测试放入 XSS 载荷
    applies: [platform:web]
    why: 用户内容、评论、工具输出里的 HTML 是 XSS 的主要入口。净化器本身也会有漏洞，所以先避免渲染 HTML，必须渲染时再净化。
    detail: |
      - 链接只允许 http、https、mailto 等白名单协议，拒绝 `javascript:`。
      - 需要渲染 HTML 时用 DOMPurify 这类维护活跃的净化库，配置严格白名单。
      - 图示代码（如 Mermaid）来自用户时，开启其安全模式。
    sources: [S28, S26, S25, S20]
    see: ["25"]
  - id: WEB-022
    title: 访问令牌和刷新令牌不得写入 localStorage 或 sessionStorage
    level: hard
    check: semi
    how: 代码扫描查找对 localStorage/sessionStorage 写入 token 类键名；评审登录实现
    applies: [platform:web]
    why: 页面一旦有 XSS，脚本可读的存储里的令牌会被直接窃取。
    detail: |
      推荐服务端会话加 HttpOnly、Secure、SameSite Cookie，或由 BFF（为前端服务的后端）持有令牌。用 Cookie 鉴权时写操作要有 CSRF 防护，CORS 不能代替 CSRF 防护，方案见 19。确需在前端持有令牌时，只放内存并缩短有效期。
    sources: [S27]
    see: ["19", "25"]
  - id: WEB-023
    title: 前端构建产物不依赖内联脚本和 eval，能在不含 unsafe-inline、unsafe-eval 的 CSP 下正常运行
    level: hard
    check: auto
    how: E2E 在启用严格 CSP 的环境运行，检查控制台和 CSP 报告里没有违规
    applies: [platform:web]
    why: 产物离不开 unsafe-inline 或 unsafe-eval，CSP 就形同虚设。静态站点可以用哈希，SSR 可以用 nonce。
    sources: [S29]
    see: ["25"]
  - id: WEB-024
    title: 权限以服务端校验为准；前端隐藏按钮和菜单只是体验，不作为访问控制
    level: hard
    check: semi
    how: 每个受保护接口有服务端权限负例测试；评审时检查是否有只靠前端判断的权限
    applies: [platform:web]
    why: 前端代码和请求都能被用户随意修改。
    sources: [S27]
    see: ["19"]
  - id: WEB-025
    title: 上传文件的类型、大小、配额和权限以服务端校验为准，前端的 accept 和大小提示只改善体验
    level: hard
    check: semi
    how: 服务端有绕过前端直接上传的负例测试
    applies: [platform:web]
    why: 前端校验可以被绕过。
    see: ["25", "20"]
  - id: WEB-026
    title: 使用服务端组件（RSC）或 SSR 框架的项目，订阅框架安全公告，严重漏洞按安全修复时限升级
    level: hard
    check: auto
    how: 依赖漏洞扫描覆盖框架包，告警进入安全修复流程
    applies: [platform:web]
    why: 服务端渲染让前端框架的漏洞变成服务端漏洞；React 官方曾公告服务端组件的严重漏洞。
    sources: [S33]
    see: ["25"]
  # ── 第三方资源与私有化 ──
  - id: WEB-027
    title: 页面加载的外部脚本、字体、CDN、iframe、统计和地图服务列成清单，写明域名、用途、传出的数据和离线替代
    level: soft
    check: auto
    how: CI 扫描构建产物里的外部 URL，与清单比对，不在清单里的报错
    applies: [platform:web]
    why: 外部资源会带出用户数据，也会在内网和断网环境里失效。
    see: ["27"]
  - id: WEB-028
    title: 私有化或断网部署的前端，字体、图标、样式、Worker（PDF.js、Monaco 等）全部随应用提供，不请求任何未批准的外部地址，并在断网环境验收
    level: hard
    check: auto
    how: E2E 在屏蔽外网的环境运行核心流程，拦截并记录所有外部请求，有则失败
    applies: [platform:web, kind:onprem]
    why: 联网环境下能用不代表断网能用；字体、Worker 和图标偷连外网，是断网部署最常见的故障。
    ref_value: 参考值：未批准的外部请求为 0 个。
    sources: [S19, S21, S24]
    see: ["32"]
  - id: WEB-029
    title: 前端错误和性能上报先去敏：不上报用户输入、正文、令牌和完整 URL 查询参数；含客户数据的上报不得发往未批准的公网服务
    level: hard
    check: semi
    how: 上报 SDK 配置统一的过滤钩子并有单元测试；评审出口清单
    applies: [platform:web]
    why: 错误上下文、录屏和面包屑里常带着用户数据，发到第三方就是数据外泄。
    detail: |
      - 生产 sourcemap 只上传给监控服务，不随静态资源公开部署。
      - 录屏类功能默认关闭，开启需隐私评审。
    see: ["27", "26"]
  - id: WEB-030
    title: 每次构建带唯一的发布编号，错误上报和性能数据都附带它
    level: soft
    check: auto
    how: CI 检查构建产物里注入了发布编号；监控里能按发布编号筛选
    applies: [platform:web]
    why: 没有发布编号，线上错误无法对应到具体版本和 sourcemap。前端错误边界也不能代替服务端观测。
    see: ["26"]
  # ── 性能 ──
  - id: WEB-031
    title: 为首屏和主要路由设包体积预算并在 CI 检查，超出要在 PR 里说明
    level: soft
    check: auto
    how: 用 size-limit 或构建分析工具在 CI 比对预算
    applies: [platform:web]
    why: 不设预算，「顺手引入一个大库」会逐步拖慢首屏。
    ref_value: 起步参考（自拟草案，无公认出处，按目标设备和网络校准）：登录后 SPA 首屏 JS 约 170 KB（gzip）；内容页首屏 JS 约 80 KB（gzip），纯内容页力争 0 JS；按需加载的单个 chunk 超过约 250 KB（gzip）时说明。
  - id: WEB-032
    title: 代码编辑器、图表、PDF 预览、富文本、白板、Office 预览按路由或交互懒加载，不进首屏包
    level: soft
    check: auto
    how: 构建分析检查首屏 chunk 里不含这些库
    applies: [platform:web]
    why: 这些库体积大，只有少数页面用到，却让所有用户付出首屏成本。
  - id: WEB-033
    title: 在生产环境用真实用户数据按 P75 衡量 LCP、INP、CLS，以官方「良好」阈值为目标；实验室跑分不代替真实用户数据
    level: soft
    check: auto
    how: 用 web-vitals 采集上报到自有收集端；CI 另跑 Lighthouse 防退步
    applies: [platform:web]
    why: 开发机上的满分不能说明中低端设备和慢网络上的体验。
    ref_value: 官方「良好」阈值：LCP ≤ 2.5 秒、INP ≤ 200 毫秒、CLS ≤ 0.1，按 75 百分位计；移动和桌面分开看。
    sources: [S30]
  - id: WEB-034
    title: 首屏最大内容的图片不懒加载并写明宽高；字体自托管并设置 font-display
    level: soft
    check: auto
    how: Lighthouse CI 检查 LCP 图片懒加载和布局偏移；构建扫描字体来源
    applies: [platform:web]
    why: 懒加载 LCP 图片会推迟最大内容绘制；不写尺寸会引起布局偏移。
    sources: [S31]
  # ── 打包形态 ──
  - id: WEB-035
    title: 嵌入第三方页面的组件做样式和全局变量隔离；宿主不可信或需强隔离时用 iframe
    level: soft
    check: manual
    how: 在一个带冲突样式的测试宿主页面里加载组件，检查双方样式互不影响
    applies: [platform:web]
    why: 嵌入组件污染宿主的全局 CSS 和 window，会破坏客户页面。
  - id: WEB-036
    title: 可复用组件库把 react、react-dom 声明为 peerDependencies，构建时不打进产物，并提供 exports 和类型声明
    level: soft
    check: auto
    how: CI 检查 package.json 的 peerDependencies，并扫描产物中不含 React 源码
    applies: [platform:web, kind:library]
    why: 组件库自带一份 React 会让使用方出现两份 React 实例，hooks 失效。
