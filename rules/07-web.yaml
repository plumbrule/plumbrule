antipatterns:
  - { bad: 把所有接口数据放进全局 store, instead: 服务器数据交给请求缓存库，store 只放客户端界面状态 }
  - { bad: 每个页面自己写 fetch、401 处理和重试, instead: 统一 HTTP 客户端层加接口生成类型 }
  - { bad: 随手新建 Modal、Popover、Select, instead: 基于可访问基础组件库实现 }
  - { bad: 为一千行数据自写虚拟列表, instead: 用 TanStack Virtual }
  - { bad: 几百 KB 的编辑器加载到所有页面, instead: 按路由或交互懒加载 }
  - { bad: 把工具输出或评论里的 Markdown 当 HTML 注入, instead: react-markdown 禁用原生 HTML 并校验链接 }
  - { bad: 在 useEffect 里随手开 WebSocket 且不清理, instead: 集中的通信层管理连接、重连和去重 }
  - { bad: 看包名相似就引入, instead: 核对精确包名、许可证和归档状态 }
  - { bad: 把 npm update 当修复, instead: 锁定版本、逐个升级、完整回归、准备回滚 }
  - { bad: 断网后字体和图标不见了，却说系统支持离线, instead: 屏蔽外网后跑完整的冒烟测试 }
  - { bad: 用 UI 截图代替功能断言, instead: E2E 断言六种状态，截图只做视觉验收 }
  - { bad: 引入一批库作为「平台能力储备」, instead: 有需求时按功能引入并登记 }
