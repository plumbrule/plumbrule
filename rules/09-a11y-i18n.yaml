open_questions:
  - GB/T 37668-2026 与 WCAG 2.2 的逐条差异未核对正文（标准信息页已核实：2026-10-30 发布、2027-02-01 实施、非等效采用 ISO/IEC 40500:2025、全部代替 2019 版）。
  - 《无障碍环境建设法》对互联网信息服务的具体条款（报告称第 32 条，涉及政务和财政资金建设的服务）未核实；适用范围判断归 27。
  - 欧洲无障碍法案自 2025-06-28 起适用（报告说法，本轮未联网复核）；EN 301 549 V4.1.1 何时在欧盟官方公报引用、成为推定合规依据，待确认。
  - WCAG 3 最新工作草案的确切日期未核实（已确认仍是工作草案，W3C 明确不替代 WCAG 2）。
  - eslint-plugin-jsx-a11y 的维护活跃度、Playwright、@axe-core/playwright、Weblate、Tolgee、react-hotkeys-hook、hotkeys-js 的许可证本轮未联网复核（axe-core 已核实为 MPL-2.0）；Tolgee 免费自托管席位数属易变商业条款。
  - GB/T 45395-2025（小程序无障碍）报告列为来源但未展开，是否需要单独规则待补调研。
  - 待补调研：界面文案的语气指南与中英文写作规范（标点、中英混排的具体规则）。
  - 待补调研：通知打扰程度的分级定义。
  - 待补调研：国产读屏软件、信创浏览器和 WebView 的测试范围。
  - 待补调研：移动端和桌面端的无障碍等效测试矩阵。
  - 待补调研：翻译管理平台的更全面对比（Pontoon、Crowdin 等）以及 MessageFormat 2 的成熟度。
