open_questions:
  - Poppler 的许可（据了解为 GPL-2.0 或 GPL-3.0），本次未从官方仓库核实
  - PaddleOCR、RapidOCR 各模型权重的许可未逐个核实；Unstructured 高精度模式所用模型的许可未核实
  - Marker 代码许可于 2026-07 由 GPL-3.0 改为 Apache-2.0，MinerU 在 2026 年 3–4 月间多次在 AGPL-3.0 与 Apache-2.0 之间变更、最终为 Apache-2.0 加附加条款；两者变化频繁，每次升级须重新核对 LICENSE
  - 程序式 PDF 生成的选型（ReportLab、PDFKit、pdf-lib、QuestPDF 等）及其许可、维护状态未核实，暂未写入选型
  - LibreOffice 各发布分支的停止支持日期未核实
  - 待补调研：Ghostscript、Poppler、MuPDF、libvips 被间接引入时的许可风险与替代方案
  - 待补调研：OFD、WPS 专有格式、老式 .doc/.xls/.ppt、带电子签章的 PDF 的解析与转换
  - 待补调研：Go、Rust 的 Office 写入和 PDF 处理库；.NET 的 Office 与 PDF 库许可（QuestPDF、ImageSharp 等）
  - 待补调研：国产 CPU 与操作系统（ARM64、龙芯、统信、麒麟）上解析器、OCR、LibreOffice、Chromium 的可用性
  - 待补调研：云端 OCR 与文档识别服务（国内外）的数据驻留和私有化部署选项
