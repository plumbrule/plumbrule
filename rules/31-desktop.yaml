open_questions:
  - Tauri 2 仍在持续发布，v3 的阶段（报告称 alpha）未核实。
  - Wails v3 已正式发布、安全公告 GHSA-2p5f-2gx8-mh8m 只部分修复、Linux 默认改用 GTK4/WebKitGTK 6.0：报告说法，未核实。
  - Electron safeStorage 同步接口弃用并将在后续主版本移除：报告说法，未核实；升级 Electron 主版本时查看官方文档。
  - Artifact Signing 对个人开发者开放的国家和地区官方没有明确列出，社区说法不一；中国大陆主体能否使用未核实。
  - EV 证书不再自动免除 SmartScreen 提示：沿用报告引用的微软文档，本次未重新核实。
  - Tauri 用 WebdriverIO 在 macOS 上测试的具体方式（报告称原生 tauri-driver 在 macOS 上可能依赖商业方案）说法含糊，待核实。
  - GlitchTip 对原生崩溃转储（minidump）的支持程度未核实。
  - 待补调研：.NET 系桌面框架（MAUI、Avalonia、WinUI）的选型与许可。
  - 待补调研：原生 SwiftUI/AppKit 桌面应用、Qt 的模块级许可证清单与商业许可条款。
  - 待补调研：Snap 分发、Mac App Store 与 Microsoft Store 的上架规则。
  - 待补调研：统信 UOS、麒麟等国产系统的应用商店上架、签名体系和 WebKitGTK 供给情况。
  - 待补调研：Linux deb/rpm 签名仓库和 AppImage 签名的推荐工具。
