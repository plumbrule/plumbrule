open_questions:
  - 网络安全法修正后，网络日志「不少于六个月」所在的条号（原第二十一条，修正新增条文后条号可能变化）未核对修正后全文。
  - 网络数据安全管理条例「处理记录至少保存三年」是否为第十二条、标识办法「例外日志不少于六个月」是否为第九条，沿用原调研，未逐条核对原文。
  - 《数据出境安全管理政策法规问答》（2026 年 9 月）和网信办 2026-09-14 关于生成式 AI 备案与登记两条路径的公告，原调研引用，未核实。
  - AI Act 新增禁止条款中，儿童性虐待内容相关禁止是 2026-07-27 还是 2026-12-02 起适用，二手来源说法不一；欧盟官方时间线页标为 2026-12-02。Regulation (EU) 2026/1744 正文未直接打开核对。
  - CCPA 新规中自动化决策技术义务自 2027-01-01 起适用、网络安全审计 2028–2030 分阶段提交，沿用原调研，未核实；CPPA 获批日期原调研有 2025-09-22 和 2025-09-23 两种写法。
  - 生成式 AI 标识配套强制性国家标准的编号未核实。
  - 各语言许可检查工具（license-checker、go-licenses、pip-licenses、cargo-deny）的许可证和维护状态未核实；ScanCode 许可数据的具体许可未核实。
  - Apache-2.0 原文来源引用的是 ORT 仓库副本，应换成 apache.org 原文链接。
  - 待补调研：隐私类工具选型（个人信息识别如 Presidio、数据目录、同意管理、个人请求处理流程）。
  - 待补调研：算法推荐管理规定与算法备案、深度合成管理规定对工程的要求。
  - 待补调研：个人信息出境标准合同办法及备案流程、出境安全评估申报的工程准备。
  - 待补调研：未成年人网络保护条例、生成式人工智能服务安全基本要求、数据分类分级国家标准对工程的要求。
  - 待补调研：跨主题的组件许可登记表（18、20、22、03、04、07 等主题点名的组件许可以登记表为准）。
