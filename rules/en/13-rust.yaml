open_questions:
  - "The original research claimed that Rust 1.100 (2026-11-12) stabilized a dependency publish cooldown (`global-min-publish-age`, which does not constrain `cargo install`), `[lints.cargo]` unused-dependency diagnostics, and the never type; online searches found only indirect mentions and no official release notes, so this is not yet a rule; once verified, consider adding \"recommend enabling the cooldown\""
  - "Cargo.lock: the Cargo FAQ has been verified to say \"cargo new tracks the lockfile by default; whether to commit it depends on the project's needs\"; the change in guidance in the 2023-08-29 official blog post was not reopened and rechecked this time"
  - "YAML serialization: serde_yaml is deprecated; the yaml_serde crate recommended by the original research has an uncommon name and unclear maintenance status, so check crates.io before settling on a replacement"
  - "Whether Rocket has stopped publishing stable releases (the original research claimed the latest stable release dates from 2024-05) is unverified, so it is not yet listed as not recommended"
  - "Licenses not verified against the official LICENSE files: thiserror, anyhow, tracing, reqwest, clap, cargo-nextest, Actix Web, SeaORM, Diesel, proptest, loom, insta, PyO3, napi-rs, cxx"
  - "cargo-deny's maintenance activity (latest release date) could not be confirmed from the repository home page this time; the README does not name the advisory database, and the claim that it is RustSec is based on existing knowledge"
  - "The rmcp, zip, and utoipa version lines in the original research differ significantly from the published versions; verify them if referenced later"
  - "Research to add: there is no data on \"when Rust is worth using\" or \"how reliably coding agents write Rust\"; the original research offers only engineering judgment"
  - "Research to add: runnable examples of deny.toml, clippy.toml (including test exemptions), and a CI feature matrix; examples must actually run successfully before publishing"
  - "Research to add: compatibility of openGauss and other domestic Chinese databases with SQLx / tokio-postgres; hands-on testing of targets for domestic Chinese CPUs and operating systems (to be settled together with 17 and 26)"
  - "The division of responsibilities between Rust and Tauri desktop backends for FFI and native dependency packaging needs to be agreed with 31"
