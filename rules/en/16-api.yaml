open_questions:
  - The licenses of Spectral, Redocly CLI, oasdiff, Scalar, Redoc, OpenAPI Generator, and AsyncAPI CLI were not verified online this time; each repository's LICENSE is authoritative
  - "Details of the MCP 2026-07-28 tools specification, such as isError, structuredContent, outputSchema allowing any JSON type, and tool annotations being untrusted, were not individually re-verified online this time"
  - The original report claimed that the HTTP QUERY method became RFC 10008 in 2026-06; this is unverified, and QUERY will not be written into the rules until it is verified
  - "Defaulting JSON fields in new APIs to camelCase is a ruling of this topic (based on the Microsoft guidelines and the frontend ecosystem), while guidelines such as Zalando's use snake_case; the position needs to be reconfirmed with 02"
  - "Research pending: choice of mock server and consumer-driven contract testing tools (coordinate with 04)"
  - "Research pending: off-the-shelf libraries or services for sending webhooks (including options that can be deployed on-premises)"
  - "Research pending: Connect and GraphQL implementations and licenses per language; industry conventions for field-selection and filter parameters"
