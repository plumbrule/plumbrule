open_questions:
  - "Exact date the MinIO community edition repository was archived: various sources say it entered maintenance mode in 2025-12, was first archived in 2026-02, and archived again in 2026-04; GitHub currently shows it as archived, and the specific dates should follow MinIO's official statement. Whether the mc client has also been archived has not been verified."
  - "Dragonfly: the DSAL text has been verified (100 vCPU total production cap, no redistribution as a standalone product), but the version boundary of \"switched to DSAL from 2.1\" and the scope of the older BSL have not been verified; whether there is usage reporting has also not been verified."
  - "Redpanda's main GitHub repository shows as archived, possibly due to a repository move or a change in open-source strategy; the current status and license of the community edition need verification."
  - "The following licenses are carried over from the original research or based only on GitHub's detection, without reading each official LICENSE: RabbitMQ (MPL-2.0), the Meilisearch Community/Enterprise Edition boundary, pg_bigm, Ceph (LGPL combination), JobRunr (open-source edition LGPL-3.0, Pro edition commercial), Inngest (SSPL with delayed conversion to Apache-2.0), Kafka/Pulsar/RocketMQ/Airflow (Apache-2.0), and the community/commercial boundary of the Hatchet server."
  - "Whether self-hosted production use of Camunda 8 requires a commercial license needs verification; if it does, Flowable is the default for BPMN scenarios in Java."
  - "Research to add: the applicable boundaries of Redis Streams and RabbitMQ Streams as lightweight event streams."
  - "Research to add: maturity of Rust PostgreSQL task queue libraries (e.g. apalis); comparison of Quartz, PowerJob, and DolphinScheduler on the JVM; selection between Camunda and Flowable."
  - "Research to add: gateway products for rate limiting (Envoy global rate limiting, NGINX, APISIX, etc.) and rate-limiting libraries for each language."
  - "Research to add: requirements for using etcd and ZooKeeper as lock and coordination services."
  - "Research to add: maintenance status and licenses (including the SCWS dictionary) of the IK analysis plugin, pg_jieba, and zhparser for Chinese search, and their compatibility with domestic Chinese databases; there is no measured comparison of Chinese search quality across engines."
  - "Research to add: maturity, operational cost, and migration plans for self-hosted object storage (Ceph RGW, SeaweedFS, Garage, etc.)."
  - "Research to add: quantitative signals for when a database task queue should be replaced by a dedicated queue (the \"over 20% of the task time limit\" and \"3 observation windows\" given in the original research have no source and were not adopted)."
