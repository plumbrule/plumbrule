open_questions:
  - "Whether OpenAI's acquisition of Astral has closed, and whether governance and licensing of uv/Ruff/ty change afterward (when announced on 2026-03-19 it required regulatory approval; no closing announcement was found)"
  - "Whether the pydantic.v1 compatibility layer still works on newer Python versions (the version policy page does not say); the timeline for Pydantic V3"
  - Whether the uv_build build backend has been marked stable and is suitable as the default (not verified)
  - "Licenses are carried over from the original research and have not been checked one by one against the official LICENSE files: uv, Hatchling, mypy, Pyright, Django, Flask, SQLAlchemy, psycopg, Alembic, Celery, RQ, Dramatiq, pytest, Hypothesis, pip-audit, structlog"
  - "Ruff rule codes (PGH003/PGH004, RUF006, ASYNC210/251, S113, etc.) were written from the original research and existing knowledge and have not been verified one by one against the current rules page"
  - "Compatibility of domestic Chinese databases (openGauss, Dameng, KingbaseES, etc.) with psycopg 3, SQLAlchemy and Alembic: research pending"
  - "Research pending: maturity and recommendation of Python mutation testing tools (e.g. mutmut, cosmic-ray)"
  - "Research pending: breaking-change checking tools for the OpenAPI exported by FastAPI (to be decided together with 16)"
