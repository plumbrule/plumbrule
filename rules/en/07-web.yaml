open_questions:
  - The current Next.js major version status and self-hosting requirements were not verified online this time (the original report said Next.js 16).
  - "Radix Primitives' maintenance activity is unclear: third-party comparisons say its releases have slowed, and no official roadmap was found; the default recommendation of Base UI for new projects is partly based on this."
  - Tailwind Labs was reportedly acquired by Shopify in 2026-09, with the framework remaining open source under MIT; no official announcement was found to verify this.
  - The handover of React to the React Foundation under the Linux Foundation is supported by only a single community source; the official announcement has not been verified.
  - The release date of the stable Base UI 1.0 (reportedly 2025-12) has not been verified on the official releases page.
  - Apart from Tailwind, library licenses were taken from a snapshot in the original report and not individually verified against the LICENSE files in the official repositories; the licenses of self-hosted Sentry, GlitchTip, tldraw, ONLYOFFICE, and Collabora need separate verification.
  - The new Remix is still in pre-release; its positioning relative to React Router needs to be reviewed after the stable release.
  - "The 170/80/250 KB bundle size budgets are our own draft; research pending: the basis for frontend bundle size budgets commonly used in the industry."
  - "Research pending: example dependency lists for admin consoles (Ant Design), Vue, and embeddable widgets."
  - "Research pending: when to use micro-frontends, and with what."
  - "Research pending: choice and security boundaries of browser terminals (such as xterm.js)."
  - "Research pending: practices for frontend compatibility testing on domestic Chinese operating systems and browser engines."
