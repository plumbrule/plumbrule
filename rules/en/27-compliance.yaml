open_questions:
  - "After the Cybersecurity Law amendment, the article number containing the network log requirement of \"no less than six months\" (formerly Article 21; numbering may have changed after new articles were added) has not been checked against the full amended text."
  - "Whether the Regulations on Network Data Security Management's \"keep processing records for at least three years\" is Article 12, and whether the Labeling Measures' \"exception logs kept no less than six months\" is Article 9, are carried over from the original research and have not been checked article by article against the original text."
  - "The Q&A on Cross-Border Data Transfer Security Management Policies and Regulations (September 2026) and the CAC announcement of 2026-09-14 on the two paths of generative AI filing and registration are cited in the original research and have not been verified."
  - "Among the AI Act's newly added prohibitions, secondary sources disagree on whether the prohibition related to child sexual abuse material applies from 2026-07-27 or 2026-12-02; the official EU timeline page lists 2026-12-02. The text of Regulation (EU) 2026/1744 has not been opened and checked directly."
  - "That the CCPA regulations' automated decision-making technology obligations apply from 2027-01-01 and that cybersecurity audits are submitted in phases from 2028 to 2030 are carried over from the original research and have not been verified; the original research gives the CPPA approval date as both 2025-09-22 and 2025-09-23."
  - The number of the mandatory national standard accompanying generative AI labeling has not been verified.
  - "The licenses and maintenance status of the language-specific license checkers (license-checker, go-licenses, pip-licenses, cargo-deny) have not been verified; the specific license of ScanCode's license data has not been verified."
  - The Apache-2.0 text source cites the copy in the ORT repository and should be replaced with a link to the original text on apache.org.
  - "Research to add: privacy tool selection (personal information detection such as Presidio, data catalogs, consent management, individual request handling workflows)."
  - "Research to add: engineering requirements of the provisions on algorithmic recommendation management and algorithm filing, and the provisions on deep synthesis management."
  - "Research to add: the Measures on Standard Contracts for Cross-Border Transfer of Personal Information and the filing process, and engineering preparation for cross-border transfer security assessment applications."
  - "Research to add: engineering requirements of the Regulations on the Protection of Minors Online, the Basic Security Requirements for Generative AI Services, and the national standard for data classification and grading."
  - "Research to add: a cross-topic component license register (component licenses named in topics such as 18, 20, 22, 03, 04, and 07 defer to the register)."
