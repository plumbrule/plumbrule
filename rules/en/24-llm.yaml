open_questions:
  - "The original report states that \"in 2026-09 Envoy AI Gateway was renamed Agent Router and its repository was migrated\"; unverified. The selection uses the original name for now"
  - "The original report states that the OpenTelemetry semantic conventions for generative AI moved to a separate repository in 2026-05; unverified. LLM-036 only requires pinning the version used"
  - "Arize Phoenix server license (the original report says Elastic License 2.0, which restricts offering it as a hosted service); unverified"
  - "Ragas repository URL and maintenance activity (the repository URL given in the original report is questionable); unverified"
  - "The full terms of the LiteLLM enterprise/ directory license and the list of enterprise features are as stated officially; this review only verified the LICENSE split and some of the features"
  - "The closing date of OpenAI's acquisition of promptfoo, and whether its open-source license and governance changed after the acquisition, need to be rechecked at the next review"
  - "The OWASP Top 10 for LLM Applications now has a 2026 edition (published 2026-08); cross-check item numbering together with 25"
  - "Security recommendations for MCP and tool calling (official MCP security best practices, tool description poisoning) have not been verified item by item; the rules only cover general practices. Protocol details follow 16"
  - "The licenses of Vercel AI SDK, Pydantic AI, LangChain, LlamaIndex, SGLang, Ollama, and llama.cpp are carried over from the original report and have not been individually re-verified against the official LICENSE files"
  - "Research to be added: representative models for each task tier (including Chinese domestic models) and selection methods, with dates"
  - "Research to be added: hardware tier recommendations for local inference (mapping GPU memory and concurrency to model size)"
  - "Research to be added: selection of guardrail and content moderation tools (input/output filtering)"
  - "Research to be added: selection and evaluation methods for embedding models and reranking models"
  - "Research to be added: adaptation practices for domestic Chinese model gateways and domestic inference chips"
