open_questions:
  - "Research pending: connecting third-party accounts as an OAuth client (not covered by the original report). INT-036 to INT-039 were compiled from RFC 9700, 7636 and 7009; S30–S32 record only the compilation date and the original texts were not checked online clause by clause; recommended OAuth client libraries per language are undecided."
  - Yahoo's requirements for bulk senders (whether they match Gmail's, and the thresholds) have not been verified separately; Outlook.com's requirements for high-volume senders have not been researched.
  - Gmail's one-click unsubscribe "processed within two days" and "roughly 5,000 messages per 24 hours" come from Google's sender guidelines and were verified this time via search results; sources disagree on whether transactional email counts toward the threshold.
  - "Standard Webhooks timestamp tolerance window: 16 records that the spec gives no value, while secondary sources claim the spec recommends 300 seconds; this needs checking against the spec text."
  - Novu's license split (core MIT, enterprise directory under a commercial license) was verified this time only from secondary sources and should be confirmed against the LICENSE files in the official repository; the licenses of Apprise, Postal, React Email, MJML, listmonk, Mailpit and GreenMail have not been verified online.
  - The exact shutdown date of the legacy FCM APIs (sources range from June to July 2024) should follow the official Firebase page.
  - Whether the OWASP Webhook Security Cheat Sheet cited in the original report exists has not been verified, and it is no longer used as a source.
  - "Research pending: the specific capabilities (cards, callbacks, message recall) and rate limits of DingTalk and WeCom bots; the specific signature verification method for Feishu app bot callbacks."
  - "Research pending: selection of international SMS providers; push from Chinese vendors such as Xiaomi, OPPO and vivo (belongs to 28)."
  - "Research pending: implementation approaches for in-app messages (notification center); tiering notifications by level of intrusiveness (the same gap as in 09)."
  - The original report's content on maps (coordinate systems, Nominatim usage policy) and object storage integration was not included in this topic; ownership of map services is undecided, and for object storage see 17.
