open_questions:
  - "The current toolchain versions stated in the report (Xcode 27.2, Swift 6.4.2) were not verified online; the rules do not depend on specific versions, and a version ledger is maintained separately."
  - "The report claims Xcode 27 introduces a JSON-format project configuration file, based on a single sentence of sourcing and not verified; once verified, decide whether it affects the practice of committing and reviewing project files."
  - "The report claims that in 2026-06 App Store statistics, 79% of iPhones were on iOS 26; not verified and not written into the rules."
  - "The plan and date for making the CocoaPods trunk read-only were not verified; once verified, they can serve as a stronger reason for \"new projects do not use CocoaPods\"."
  - "SwiftLint's license (MIT) and maintenance status were not rechecked online this time; the claim that swift-format ships with the Xcode toolchain comes from community material since 2024, and no official Apple documentation page was found."
  - "Whether the specific name and process for custom app distribution have changed under the Apple Business platform has not been confirmed in official Apple documentation."
  - "Interoperability details between Swift Testing and XCTest in newer Xcode versions (the community says it is on by default) have not been confirmed in official Apple documentation."
  - "Research pending: the default approach to navigation (NavigationStack and how routing is organized)."
  - "Research pending: whether to recommend an off-the-shelf dependency injection library (compare with Hilt in 29 Android)."
  - "Research pending: implementing logging (OSLog), crashes and performance (MetricKit) on iOS."
  - "Research pending: engineering standards for in-app purchases (StoreKit 2) and subscriptions."
  - "Research pending: review requirements for deep links and Universal Links, and Sign in with Apple."
  - "Research pending: whether to recommend project generation tools (Tuist, XcodeGen)."
  - "Research pending: the concrete steps for cross-platform projects (React Native, Flutter) to migrate the iOS side from CocoaPods to SPM and to merge privacy manifests."
