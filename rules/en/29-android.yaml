open_questions:
  - "First countries where Android developer verification takes effect: the official page lists Indonesia, Singapore and Thailand, and some reports also include Brazil; whether it affects non-Google-certified devices in mainland China and distribution through Chinese app stores is to be confirmed"
  - "The current terms of Google Play's policy on photo and video permissions (READ_MEDIA_* may be requested only for core functionality) have not been verified clause by clause; once verified, AND-016 could be upgraded to a hard constraint"
  - The status of the Navigation 3 stable release and the new Room major release line comes from the original report and has not been re-verified
  - "Which AGP version Kotlin's official Gradle/AGP compatibility table currently covers has not been re-verified (the current AGP major version is 9, which has been verified)"
  - "detekt's support for the current Kotlin version and ktlint's maintenance cadence have not been verified"
  - "Licenses of third-party libraries such as Gradle Play Publisher, fastlane, Coil, Koin, Roborazzi and Paparazzi have not been individually verified against the LICENSE files in their official repos (the original report lists Gradle Play Publisher as Apache-2.0; to be confirmed)"
  - "The Xiaomi push channel policy change milestone on 2026-12-31 (mentioned in the original report, details not verified) is tracked under topic 28"
  - "Research to add: listing review rules for the OPPO, vivo and Honor app stores"
  - "Research to add: Android-side choices for crash reporting and logging libraries (domestic and international options, self-hosted deployment)"
  - "Research to add: maturity and CI integration of Baseline Profile, Macrobenchmark and screenshot testing tools"
