open_questions:
  - "Tauri 2 is still being released continuously; the stage of v3 (the report says alpha) is unverified."
  - "Wails v3 has been officially released, security advisory GHSA-2p5f-2gx8-mh8m is only partially fixed, and Linux now defaults to GTK4/WebKitGTK 6.0: claims from the report, unverified."
  - "The Electron safeStorage synchronous APIs are deprecated and will be removed in a later major version: a claim from the report, unverified; check the official docs when upgrading the Electron major version."
  - "The countries and regions where Artifact Signing is open to individual developers are not clearly listed officially, and community accounts vary; whether entities in mainland China can use it is unverified."
  - "EV certificates no longer automatically bypass SmartScreen prompts: based on the Microsoft documentation cited by the report, not re-verified this time."
  - "How exactly to test Tauri with WebdriverIO on macOS (the report says the native tauri-driver may depend on a commercial solution on macOS) is vague and pending verification."
  - "GlitchTip's level of support for native crash dumps (minidump) is unverified."
  - "Pending research: selection and licensing of .NET desktop frameworks (MAUI, Avalonia, WinUI)."
  - "Pending research: native SwiftUI/AppKit desktop apps; Qt's per-module license list and commercial license terms."
  - "Pending research: Snap distribution, and Mac App Store and Microsoft Store listing rules."
  - "Pending research: app store listing, signing systems, and WebKitGTK availability for domestic Chinese operating systems such as UnionTech UOS and Kylin."
  - "Pending research: recommended tools for signed Linux deb/rpm repositories and AppImage signing."
