open_questions:
  - "The licenses of PgBouncer, Patroni, Qdrant, Milvus, SeaweedFS, Garage, gh-ost, and Percona XtraBackup have not each been verified against the LICENSE in their official repositories (the report gives PgBouncer as ISC, Patroni as MIT, Qdrant and Milvus as Apache-2.0, SeaweedFS as Apache-2.0, Garage as AGPLv3, gh-ost as MIT)"
  - "The account of pgBackRest being archived and then resuming maintenance in 2026 comes only from secondhand reports (no announcement seen on the official website); the long-term stability of the sponsorship model remains to be seen"
  - "The report claims that the release notes of a certain PostgreSQL minor version require taking a new full backup and rebuilding some indexes; the original text has not been verified"
  - "MySQL's new version naming scheme (LTS and Innovation release lines) and Percona XtraBackup's support for new MySQL major versions have not been verified"
  - "The current state of CloudNativePG moving its built-in backups to the Barman Cloud plugin has not been verified"
  - "The current stable versions and compatibility scope of Dameng and KingbaseES have not been verified"
  - "Research pending: existing PostgreSQL queue libraries (to confirm ownership and the default recommendation jointly with 18)"
  - "Research pending: industry basis for restore drill frequency (currently only reference values), and backup orchestration tools (to align with 26)"
  - "Research pending: virus-scanning tool selection for object storage uploads (to align with 25)"
  - "Research pending: the impact of MySQL's default isolation level (Repeatable Read) on DB-021 and DB-022, and gap-locking behavior"
