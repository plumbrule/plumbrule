open_questions:
  - "Whether TypeScript 7.1 (with a stable programmatic API) has been released, and when typescript-eslint will support TypeScript 7 natively; the current basis is the 7.0 RC announcement and community reports, and the transitional approach in TS-035 will need updating then"
  - The exact package name and usage of the TypeScript 6 API compatibility package have not been verified against official documentation
  - "The current detection rate of Biome's type rules (the official 75% is preliminary data from the v2 release), and whether `noFloatingPromises` has moved out of the nursery group"
  - "\"Newer Node versions no longer bundle Corepack and it must be installed separately\" has not been verified online"
  - "Whether Node has removed `--experimental-transform-types` (seen only in the nightly docs); not verified for stable releases"
  - "The current pnpm major version number, and the difference in strictness of `minimumReleaseAge` between its default value and an explicit setting (loose mode allows packages automatically), need re-checking"
  - "The licenses of Vitest, fast-check, StrykerJS, MSW, Kysely, Zod, Valibot, Fastify, Hono, Pino, p-limit, pnpm, Biome, typescript-eslint, openapi-typescript, Orval, Hey API and TypeScript were not verified online this time (marked \"to be verified\")"
  - Whether newer Prisma versions still need to download binaries for code generation and the query engine in air-gapped environments has not been verified
  - "There is no reliable information on specific compatibility issues between Bun, Deno and Node (native addons, signals, child processes)"
  - "Research pending: memory leak diagnosis tools (heap snapshots, clinic, etc.) and monitoring practices for long-running processes"
  - "Research pending: detailed trade-offs between Turborepo, Nx and moon"
  - "Research pending: the current state of Node single executable applications (SEA)"
  - "Research pending: compatibility of the TypeScript 7 ecosystem (tsdown, Vitest, the various generators)"
