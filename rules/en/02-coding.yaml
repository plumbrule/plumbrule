open_questions:
  - "Research needed: industry practice for magic numbers (which values can be exempt, false-positive rates of each language's lint rules); COD-005 is currently written as soft guidance based on common practice"
  - "Research needed: cross-language conventions for file and directory naming and import grouping"
  - "Research needed: whether there are cross-language tools worth recommending for complexity and duplicate-code detection; for now we only use each language's own tools"
  - "Research needed: whether log field names should use OpenTelemetry semantic convention names or project-defined snake_case names"
  - Whether to recommend a cross-language custom rule engine (such as Semgrep), and the licensing position, to be decided jointly by 25 and 27
  - Whether internal comments may be written in Chinese and whether public SDK documentation must be in English, to be decided by 05
  - After RFC 9557 changed the meaning of `Z` to "local offset unknown", whether the output of each language's time libraries needs adjusting has not been verified one by one
  - The configuration option names for golangci-lint nolintlint have not been verified
