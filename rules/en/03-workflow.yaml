open_questions:
  - "Which repositories and plans GitHub merge queues are available for: the official page does not say; verify against your plan before enabling"
  - Whether GitHub Enterprise Server can use Actions, caching, and package registries fully air-gapped needs separate verification
  - "The licenses of Lefthook, pre-commit, commitlint, Changesets, semantic-release, and GoReleaser are carried over from the original research and have not been checked one by one against the official LICENSE files; the feature boundary between GoReleaser's commercial and open-source editions has not been verified"
  - "Whether Renovate's license is AGPL-3.0-only or or-later: the LICENSE file is the full AGPL v3 text; confirm against the declaration in package.json"
  - "Details of signed commits and approval rules for protected branches in Gitea's stable documentation: the original research cited development-version docs; verify against the version actually deployed"
  - "The mapping between GitLab tiers (Free, Premium, Ultimate) and the Community Edition / Enterprise Edition licenses is oversimplified in the original research"
  - "Research needed: selection of monorepo build and task tools (Nx, Turborepo, Bazel, Pants), or explicitly hand it to 10"
  - "Research needed: tools and practices for stacked PRs (e.g., Graphite, ghstack, git-town)"
  - "Research needed: mapping of roles and permission levels across platforms (GitHub's write/maintain, GitLab's Developer/Maintainer, Gitea's permissions)"
  - "Research needed: capability differences between Forgejo and Gitea"
  - "Research needed: measurement definitions for process quality metrics (time to first review response, PR cycle time, rework rate, post-merge rollback rate), to be aligned with 22"
  - "Research needed: the default choice between Lefthook and pre-commit must be aligned with 02 and 12"
