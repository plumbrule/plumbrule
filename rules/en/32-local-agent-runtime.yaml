open_questions:
  - "macOS sandbox-exec: it prints a deprecation warning at runtime, but this is documented only in a community issue; Apple has no public removal date or replacement path, and Claude Code and Codex still use it. Recheck with each major macOS release."
  - The claim that "WSL containers (wslc) are generally available" has only a release listing page as its source and is unverified; whether to adopt it as a Windows alternative remains to be validated.
  - The OS and chip requirements of Apple's container tool (the report says Apple Silicon with macOS 26 or later only) are unverified.
  - The licenses of Podman, gVisor, Lima, bubblewrap, sandbox-runtime, and WSL have not been individually verified against their official LICENSE files (the report says bubblewrap is LGPL-2.1+, to be checked).
  - The current defaults of Lima sharing the home directory read-only into the virtual machine and of Docker Desktop's default shared directories have not been individually verified; the checks in RUN-016 need to be confirmed against current versions.
  - Whether Claude Code's --bare skips the keychain and OAuth login, and the details of the trust mechanism for repository configuration, are unverified.
  - "Further research needed: the network environment in China — domestic mirror sources, enterprise proxies and TLS interception, and model gateway access when access to overseas model services is restricted."
  - "Further research needed: domestic platforms — whether rootless containers and user namespaces are available by default on Chinese operating systems such as Kylin and UOS and on domestic CPUs, and alternatives beyond WSL."
  - "Further research needed: selection of specific egress proxy software (including licenses and offline deployment)."
  - "Further research needed: egress restriction mechanisms on native Windows (WFP) and approaches with pf / Network Extension on macOS."
  - "Further research needed: how to disable telemetry connections in Claude Code and Codex, and feature compatibility (tool calls, streaming output, authentication) when connecting to an internal compatible model gateway."
  - There is no measured data on startup speed, file I/O, or compile performance for the isolation approaches; the performance thresholds in the report (warm start, cancellation time, compile slowdown ratio) are suggested values and have not been written into the rules.
