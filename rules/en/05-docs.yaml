open_questions:
  - "llms.txt: the official site labels it proposal version 2 (last modified 2026-08-10), verified; whether major model vendors actually read it is supported only by third-party claims, unverified"
  - "Whether the VitePress 1.x stable line will still get security fixes, and when 2.0 will become stable, has no clear official statement; to be followed up"
  - "Progress on Docusaurus 4 and changes in Starlight's maintainers (third parties say the Astro team has been acquired by Cloudflare) come only from third-party sources and are not verified officially"
  - "Whether Mermaid's sandbox mode has left beta; check the current docs"
  - "The current state and licensing of ADR formats (MADR vs. Nygard format) have not been verified online; research needed: whether ADR tools (e.g., adr-tools, log4brains) are worth recommending"
  - "Licenses of AutoCorrect, zhlint, textlint, and draw.io have not been verified one by one against the LICENSE in their official repositories"
  - "Research needed: how to resolve conflicts between public Chinese technical writing guides (e.g., Chinese Copywriting Guidelines, the Chinese technical documentation style guide), and a complete exception list for Chinese punctuation and spacing"
  - "Research needed: off-the-shelf tools for detecting stale docs (frontmatter-based checkers, docs site plugins); currently only hand-written scripts are used"
  - "Research needed: public standards for Chinese UI copy (belongs to 09; this topic only references it)"
  - "Research needed: hands-on results for docs sites and docs tools on domestic Chinese operating systems, CPUs, and browsers"
