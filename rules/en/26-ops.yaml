open_questions:
  - "Current versions of each tool are not written into the rules; a separate version ledger pulling from official sources is needed. The version numbers in the original report (as of 2026-11-13) have not been individually verified."
  - "The main changes in Prometheus 3 relative to 2.x (such as default behavior, UTF-8 metric names, native histograms) have not been verified; upgrade guidance is pending."
  - "The current form of Docker Compose (plugin mode, the Compose Specification) and the official position on single-host production have not been verified; the original report's claim that \"Mattermost uses Compose only for evaluation and testing\" could not be verified and cited the wrong source number, so it has been removed."
  - "Accounts of the scope of Chainguard's free tier differ (the official pricing page says 5 images, third parties say about 50); the official page is authoritative, so confirm again before adopting."
  - "The licenses of distroless, Jaeger, Harbor, Fluent Bit, and Vector have not been verified from their repository LICENSE files; Mimir's license is known only from third-party claims (AGPL-3.0) and has not been directly verified."
  - "OpenTelemetry Profiles was once said to reach \"GA in Q3 2026\"; at verification time the status page still showed no language as stable, so it is treated as alpha; check again at the next review."
  - "The claim that the new GlitchTip major version \"requires PostgreSQL 15 or later and has breaking changes to environment variables\" comes from a single release note and has not been verified."
  - "Whether local operational telemetry and product analytics instrumentation share an OTel pipeline, and where the boundary lies, needs to be aligned with 22."
  - "Research pending: selection of load testing tools (such as k6, Locust)."
  - "Research pending: Kubernetes backup orchestration (such as Velero) and system-level backup tools."
  - "Research pending: on-call and incident management tools (self-hosted and options available in China)."
  - "Research pending: comparison of log collectors (OpenTelemetry Collector, Fluent Bit, Vector, etc.)."
  - "Research pending: internal image registries (such as Harbor) and offline image sync tools; the current state of public mirror registries in China."
  - "Research pending: off-the-shelf tools for on-premises preflight checks and diagnostic bundles (such as Replicated troubleshoot, sosreport), to avoid building our own."
  - "Research pending: choice of container runtime (containerd, Docker, Podman) in on-premises and Xinchuang environments."
  - "SLO definitions, recovery plans, and flag inventories have no universal standard format; whether to specify a minimal set of fields is undecided."
