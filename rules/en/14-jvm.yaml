open_questions:
  - "The current Java LTS is Java 25; per the Oracle roadmap the next LTS is Java 29 (2027-09, the roadmap notes this may change); updates to Oracle JDK 21 after 2026-09 move to the OTN license. All of this comes from the Oracle roadmap; version numbers are not written into rules and are tracked in the version ledger"
  - "The specific end-of-support dates for each Spring Boot release line (such as 4.0 and 4.1) were seen only on third-party summary pages and not checked one by one against the official support table; rules cite only the official policy (at least 13 months of open-source support per minor release line)"
  - "The current Gradle major version is 9 (verified from the official release notes); the specific upper limit behind the original report's claim that \"the highest Gradle version fully supported by the Kotlin plugin is below the latest Gradle\" has not been rechecked against the official Kotlin compatibility table; follow the table when upgrading"
  - "Flyway Community is still Apache-2.0 and maintained by Redgate; the current feature split of Teams / Enterprise and which databases require a paid edition were seen only on older Redgate pages, and the 2026 status has not been verified"
  - "The official blog does not directly say whether \"distributing Liquibase to customers bundled with a product\" counts as competing use under the FSL; for private deliveries that ship Liquibase with the product, confirm separately per the policy in 27"
  - "The compatibility of the current Spring Cloud Alibaba version with new Spring Boot release lines (the original report said it covers only an older release line) has not been rechecked"
  - "Versions and dates in the original report for Seata, Nacos, Dubbo, Testcontainers, and others were self-contradictory or unverified and none were included; for middleware choices see 18"
  - "The maintenance status of EasyExcel, Valiktor, and QuickTheories has not been verified (suspected unmaintained); they were not included in the choices"
  - "Licenses in the choices: Hibernate, Liquibase, and Flyway were verified against official statements; the rest were filled in from GitHub's LICENSE detection on each repository (the repositories of google-java-format, PMD, Logback, and jOOQ gave no standard detection, so official statements were used); the full license texts were not read one by one"
  - "Sources added on 2026-11-14 (S03, S08, S10, S11–S15, S19, S20, S26–S32, S34, S35, S37–S43, S46–S50, S56–S58, S60) were only confirmed to be working links to official entry points; the specific passages corresponding to each rule were not checked page by page"
  - "Research needed: systematic changes in the latest Spring Boot major version and Spring Framework major version (Jakarta EE baseline, nullability annotations, starter renames, etc.); the original report covered only Jackson 3 and starter renames"
  - "Research needed: Gradle-based Spring Boot / Ktor service templates and a Maven-based library template, to be published only after they actually build successfully"
  - "Research needed: support periods and update cadence of Chinese JDK distributions (those targeting domestic Chinese CPUs); items from the Alibaba Java Coding Guidelines that can be adopted directly"
  - "Research needed: there are no sourced recommendations for JVM memory and CPU parameters in containers (sizing the heap to the container limit, etc.)"
