open_questions:
  - Poppler's license (reportedly GPL-2.0 or GPL-3.0) was not verified against the official repository this time
  - Licenses of individual PaddleOCR and RapidOCR model weights were not verified one by one; the license of the models used by Unstructured's high-resolution mode was not verified
  - Marker's code license changed from GPL-3.0 to Apache-2.0 in 2026-07, and MinerU switched between AGPL-3.0 and Apache-2.0 several times between March and April 2026, ending up as Apache-2.0 with additional terms; both change frequently, so the LICENSE must be re-verified on every upgrade
  - Selection of programmatic PDF generation tools (ReportLab, PDFKit, pdf-lib, QuestPDF, etc.) and their licenses and maintenance status were not verified, so they are not yet included in the choices
  - End-of-support dates for LibreOffice release branches were not verified
  - "Research pending: license risks and alternatives when Ghostscript, Poppler, MuPDF and libvips are introduced indirectly"
  - "Research pending: parsing and conversion of OFD, WPS proprietary formats, legacy .doc/.xls/.ppt, and PDFs with electronic seals"
  - "Research pending: Office writing and PDF processing libraries for Go and Rust; licenses of .NET Office and PDF libraries (QuestPDF, ImageSharp, etc.)"
  - "Research pending: availability of parsers, OCR, LibreOffice and Chromium on Chinese domestic CPUs and operating systems (ARM64, Loongson, UnionTech UOS, Kylin)"
  - "Research pending: data residency and on-premises deployment options for cloud OCR and document recognition services (in China and abroad)"
