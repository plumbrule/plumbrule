open_questions:
  - Cursor's support for nested AGENTS.md files (parts of the official documentation are outdated)
  - "Research pending: industry practices for small incremental commits, self-check lists, and strict lint and type enforcement in agent workflows"
  - "Research pending: how to arbitrate when multiple agents disagree"
  - "Research pending: definitions of agent evaluation metrics (first-attempt pass rate, stable pass rate across multiple runs, number of permission violations, unrelated changes, etc.)"
