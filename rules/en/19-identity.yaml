open_questions:
  - "Licenses not individually verified in this round: authentik (community edition MIT, enterprise modules under a commercial license), Logto (MPL-2.0), Casdoor, Ory Hydra/Kratos/Keto, OpenFGA, SpiceDB, Cerbos, OPA, SPIRE (all reported as Apache-2.0); verify against each repository's LICENSE before release"
  - Whether the main Casbin Go repository has moved to apache/casbin; the repository URL and license are still to be verified
  - The exact effective date of ZITADEL's switch to AGPL (third-party sources disagree; the official statement uses v3 as the boundary)
  - The official publication date of NIST SP 800-63B-4, and the specific clause on the limit of consecutive failed attempts, are still to be verified word for word
  - "The idle and absolute timeout ranges recommended by the OWASP Session Management Cheat Sheet are still to be verified (the 30 minutes / 12 hours given in the report had no source and has not been adopted)"
  - "Passkey support on Xinchuang (domestic IT innovation) endpoints, Chinese browsers and intranet domains still needs further research"
  - "Further research needed: implementation libraries for each language (OIDC clients, JWT validation, WebAuthn servers, session middleware, Argon2 implementations) and their licenses, or hand this over to the per-language topics 10–14"
  - "Further research needed: field mapping recommendations for Feishu, DingTalk and WeCom login; DingTalk and WeCom should switch to their official documentation as sources"
  - "Further research needed: hands-on compatibility testing of identity providers with Chinese domestic databases and Xinchuang CPUs/operating systems"
  - "Further research needed: an authoritative source for the SAML validation checklist"
