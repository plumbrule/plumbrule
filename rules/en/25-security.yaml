open_questions:
  - "CISA BOD 22-01 has been revoked and superseded by BOD 26-04 (as noted on the official page); the new directive's remediation deadline for KEV vulnerabilities has not been verified yet; the \"two weeks\" reference value in SEC-007 is pending an update per the new directive"
  - "Betterleaks was only released in March 2026, and third-party sources disagree about its latest version and license (the official repository showed MIT on 2026-11-14); compatibility with Gitleaks configuration and the false positive rate remain to be tested"
  - "Whether the remediation of the March 2026 Trivy incident (CVE-2026-33634) was complete, and whether all subsequent releases are signed, needs follow-up on official announcements; the official Aqua blog could not be opened directly this time"
  - "The numbering and names of each OWASP LLM Top 10 2026 entry (other than prompt injection at number one, sensitive information disclosure at number two, and excessive agency at number three) have not been checked against the original text one by one; there are two accounts of the official release date: 2026-08-04, or September together with the Agent Control Standard"
  - The official finalization date of OWASP Top 10:2025 has not been verified
  - "The content and release dates of OWASP AISVS 1.0 and the OWASP Agent Control Standard have not been verified, and they are not yet included in the rules"
  - The licensing conditions for using CodeQL on private commercial repositories have not been verified (the supporting link given in the report is questionable)
  - Whether NIST SSDF has a newer revision has not been verified
  - The exact release date of SLSA v1.2 (the official blog only goes as far as November 2025) has not been verified
  - The feature boundary between Semgrep Community Edition and the paid edition (e.g. cross-file analysis) has not been verified
  - "Research pending: WAF selection (self-hosted vs. cloud WAF, ModSecurity/Coraza and OWASP CRS)"
  - "Research pending: selection of fuzzing, policy engines (OPA/Conftest/Kyverno), dedicated IaC scanning (Checkov, KICS), and AI red-teaming tools (garak, PyRIT, promptfoo, etc.)"
  - "Research pending: comparison of false positive rates and vulnerability database synchronization methods for OSV-Scanner, Trivy, and Grype in air-gapped environments"
  - "Research pending: more external references for vulnerability remediation deadlines (e.g. PCI DSS requirements for critical patches)"
