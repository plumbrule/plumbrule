  - "The current stable Flutter release and the state of its rendering engine (the original report said 3.50 / Dart 3.14; not verified)"
  - "The current text of Apple Developer Program License Agreement 3.3.1(B) on interpreted code (this review only verified the gist of App Review Guideline 2.5.2)"
  - "The applicable boundaries of Flutter OTA solutions (e.g. Shorebird) under app store policies"
  - "The scope of official support for self-hosting EAS Update; whether the self-hosted CodePush server repository has been archived"
  - "Licenses and maintenance status of Detox, Patrol and Appium (per the LICENSE in the official repositories)"
  - "The current terms of the FSL license for self-hosted Sentry (carried over from the original report; not re-verified)"
