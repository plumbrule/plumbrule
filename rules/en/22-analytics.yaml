open_questions:
  - "Not verified online (carried over from the 2026-11-13 report): Plausible is AGPL-3.0 with an MIT tracking script, Superset is Apache-2.0, Grafana is AGPL-3.0, Matomo is GPL-3.0, GrowthBook is MIT plus an enterprise tier, Flagsmith core is BSD-3-Clause, Doris and StarRocks are Apache-2.0"
  - "Not verified: the licenses of Polars, pandas, and nbstripout"
  - The DuckDB and ClickHouse licenses were corroborated only through third-party pages; check the LICENSE in the official repositories directly before inclusion
  - Sources disagree on exactly when and in which version Soda Core switched to Elastic License 2.0; check the official release notes
  - "The obligations when embedding Metabase's open-source edition in a product (free embedding with branding vs. paid embedding license) need confirmation by legal per the policy in 27"
  - The exact licensing of ee directory features under self-hosted PostHog has not been fully confirmed
  - "Research needed: tracking SDK selection (client and server, including mobile)"
  - "Research needed: data ingestion (ETL/ELT, CDC) tools such as Airbyte, dlt, and Debezium, their selection and licenses"
  - "Research needed: whether semantic-layer tools (such as Cube and MetricFlow) are worth recommending"
  - "Research needed: selection of domestic Chinese BI and OLAP products and their compatibility with China's Xinchuang (IT application innovation) requirements"
  - "Research needed: consent management platform (CMP) selection and a standard format for consent state"
  - "Research needed: external references for A/B experiment statistical methods (power analysis, CUPED, sequential testing, SRM thresholds); current rules are based mainly on common industry practice and lack citations"
  - "Research needed: authoritative sources for chart type selection and readability rules"
  - "Research needed: the boundary between product analytics events and OpenTelemetry collection, to be aligned with 26"
