open_questions:
  - "Status of GitHub's workflow dependency lockfiles: the official docs say public preview, while third-party reports say it went GA on 2026-10-28; accounts differ on whether it covers all plans and whether it locks transitive dependencies"
  - "The timezone field for GitHub Actions schedule: confirmed by the official changelog, but the exact changelog date (03-19 or 03-26) and the details of daylight saving time handling have not been verified against the official docs"
  - "Support for `set -o pipefail` in target sh implementations (dash, BusyBox ash) has not been verified one by one"
  - "Whether Tombi can fully replace Taplo (config migration, editor support, long-term maintainer count) needs tracking; whether Biome has switched to Tombi for TOML is only seen in a third-party PR description"
  - "Whether Biome supports YAML formatting yet (which affects the division of labor in CFG-022) has not been verified"
  - "The Docker documentation and PSScriptAnalyzer documentation findings are carried over from the original research and were not re-verified in this round"
  - "Research to add: how toolchain version pinning approaches (mise, aqua, etc.) apply to script and config tools; needs to align with the choices in 10"
  - "Research to add: recommended minimal config files for hadolint, yamllint, zizmor, and SQLFluff, and the specific rule IDs corresponding to each hard requirement"
  - "Research to add: which shell to use when running just and Task on Windows; how to write GitLab CI reuse (extends, !reference, components)"
  - "Research to add: whether zsh scripts need a separate checking tool"
