open_questions:
  - 待补调研：作为客户端用 OAuth 接入第三方账号（原报告未覆盖）。INT-036 至 INT-039 依据 RFC 9700、7636、7009 整理，S30–S32 只记了整理日期，没有逐条联网核对原文；各语言推荐的 OAuth 客户端库未定。
  - Yahoo 对批量发件人的要求（与 Gmail 是否一致、阈值）未单独核实；Outlook.com 对大量发件人的要求未调研。
  - Gmail 的一键退订「两天内处理」和「约 5,000 封/24 小时」来自 Google 发件人指南，本次通过搜索结果核实，交易邮件是否计入阈值各方说法不一。
  - Standard Webhooks 的时间戳容忍窗口：16 记为规范未给定值，有二手资料称规范建议 300 秒，需对照规范原文。
  - Novu 的许可证划分（核心 MIT、enterprise 目录商业许可）本次只从二手资料核实，需以官方仓库 LICENSE 文件为准；Apprise、Postal、React Email、MJML、listmonk、Mailpit、GreenMail 的许可证未联网核实。
  - FCM 旧接口关停的确切日期（各资料为 2024 年 6 月至 7 月之间）以 Firebase 官方页面为准。
  - 原报告引用的 OWASP Webhook Security Cheat Sheet 是否存在未核实，已不作为来源。
  - 待补调研：钉钉、企业微信机器人的具体能力（卡片、回调、撤回）和限频；飞书应用机器人回调验签的具体方式。
  - 待补调研：国际短信服务商选型；小米、OPPO、vivo 等国内厂商推送（归 28）。
  - 待补调研：站内信（通知中心）的实现做法；通知打扰程度分级（与 09 的缺口相同）。
  - 原报告中地图（坐标系、Nominatim 使用条款）和对象存储对接的内容未收入本主题；地图服务的归属待定，对象存储见 17。
