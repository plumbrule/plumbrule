open_questions:
  - macOS sandbox-exec：运行时提示已弃用，但只有社区 issue 记录，苹果没有公开的移除时间或替代路线；Claude Code 和 Codex 仍在用。每次 macOS 大版本发布时复核。
  - 「WSL 容器（wslc）已正式发布」只有发布列表页作为来源，未核实；是否作为 Windows 上的备选待验证。
  - 苹果 container 工具的系统和芯片要求（报告称仅 Apple Silicon 加 macOS 26 及以后）未核实。
  - Podman、gVisor、Lima、bubblewrap、sandbox-runtime、WSL 的许可证未逐一按官方 LICENSE 核实（报告称 bubblewrap 为 LGPL-2.1+，待查）。
  - Lima 默认把家目录只读共享进虚拟机、Docker Desktop 默认共享目录的现状未逐一核实，RUN-016 的检查项需按当前版本确认。
  - Claude Code 的 --bare 是否跳过钥匙串和 OAuth 登录、仓库配置的信任机制细节未核实。
  - 待补调研：国内网络环境——国内镜像源、企业代理和 TLS 拦截、访问境外模型服务受限时的模型网关接入。
  - 待补调研：国产化——麒麟、统信等国产系统和国产 CPU 上 rootless 容器、user namespace 是否默认可用，WSL 之外的替代方案。
  - 待补调研：出口代理的具体软件选型（含许可证、离线部署）。
  - 待补调研：原生 Windows 的出口限制机制（WFP）和 macOS 的 pf / Network Extension 做法。
  - 待补调研：Claude Code、Codex 的遥测外连如何关闭，接入内网兼容模型网关时的功能兼容（工具调用、流式输出、鉴权）。
  - 隔离方案的启动速度、文件读写和编译性能没有实测数据；报告里的性能门槛（热启动、取消耗时、编译变慢比例）是建议值，未写进规则。
